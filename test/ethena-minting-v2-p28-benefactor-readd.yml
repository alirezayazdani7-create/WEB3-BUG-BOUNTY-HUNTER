name: Ethena Minting V2 P28 Benefactor Re-Add Authorization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p28-benefactor-readd:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EXECUTION_MODE: LOCAL_FORK_ONLY
      MAINNET_TRANSACTIONS: "NONE"
      LIVE_EXECUTION: PROHIBITED
      SUBMISSION: NOT_PERFORMED
      MAINNET_RPC_URL: "https://ethereum-rpc.publicnode.com"
      MINTING: "0xe3490297a08d6fC8Da46Edb7B6142E4F461b62D3"

    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Verify safety configuration
        run: |
          set -euo pipefail
          test "$EXECUTION_MODE" = "LOCAL_FORK_ONLY"
          test "$MAINNET_TRANSACTIONS" = "NONE"
          test "$LIVE_EXECUTION" = "PROHIBITED"
          test "$SUBMISSION" = "NOT_PERFORMED"
          echo "SAFETY_CONFIGURATION=PASS"

      - name: Start isolated Anvil Mainnet fork
        run: |
          set -euo pipefail
          rm -f /tmp/anvil.log /tmp/anvil.pid

          anvil --fork-url "$MAINNET_RPC_URL" \
            --chain-id 31337 \
            --host 127.0.0.1 \
            --port 8545 \
            --auto-impersonate \
            > /tmp/anvil.log 2>&1 &

          echo $! > /tmp/anvil.pid

          for i in $(seq 1 60); do
            cast chain-id \
              --rpc-url http://127.0.0.1:8545 \
              >/dev/null 2>&1 && break
            sleep 1
          done

          test "$(cast chain-id --rpc-url http://127.0.0.1:8545)" = "31337"

          test "$(cast code "$MINTING" \
            --rpc-url http://127.0.0.1:8545)" != "0x"

      - name: Run P28 local-fork PoC
        run: |
          set -euo pipefail

          forge test \
            --via-ir \
            --optimize \
            --fork-url http://127.0.0.1:8545 \
            --match-path test/MintingV2P28BenefactorReaddAuthorization.t.sol \
            -vvvv

      - name: Verify no live execution occurred
        run: |
          test "$EXECUTION_MODE" = "LOCAL_FORK_ONLY"
          test "$MAINNET_TRANSACTIONS" = "NONE"
          test "$LIVE_EXECUTION" = "PROHIBITED"
          test "$SUBMISSION" = "NOT_PERFORMED"
          echo "SAFETY_STATUS=PASS"

      - name: Stop isolated Anvil
        if: always()
        run: |
          if [ -f /tmp/anvil.pid ]; then
            kill "$(cat /tmp/anvil.pid)" 2>/dev/null || true
          fi

      - name: Dump Anvil log on failure
        if: failure()
        run: |
          cat /tmp/anvil.log || true
