File: ".github/workflows/ethena-p301-weth-discovery.yml"

name: Ethena P30.1 WETH Accounting Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p301:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Discover and verify MINTER and CUSTODIAN
        env:
          ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import json
          import time
          import urllib.parse
          import urllib.request
          import subprocess

          rpc = os.environ["ETHENA_FORK_RPC"]
          api_key = os.environ["ETHERSCAN_API_KEY"]
          contract = "0xe3490297a08d6fC8Da46Edb7B6142E4F461b62D3"

          if not rpc or not api_key:
              raise RuntimeError("RPC or Etherscan API key is missing")

          def rpc_call(method, params):
              payload = json.dumps({
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": method,
                  "params": params
              }).encode()

              req = urllib.request.Request(
                  rpc,
                  data=payload,
                  headers={"Content-Type": "application/json"}
              )

              with urllib.request.urlopen(req, timeout=20) as response:
                  result = json.load(response)

              if "error" in result:
                  raise RuntimeError(str(result["error"]))

              return result["result"]

          def topic(signature):
              return subprocess.check_output(
                  ["cast", "keccak", signature],
                  text=True
              ).strip().lower()

          latest = int(rpc_call("eth_blockNumber", []), 16)

          if rpc_call("eth_getCode", [contract, hex(latest)]) == "0x":
              raise RuntimeError("Minting V2 has no bytecode at latest block")

          print("Latest block:", latest, flush=True)
          print("Finding deployment block...", flush=True)

          low, high = 0, latest

          while low < high:
              mid = (low + high) // 2
              code = rpc_call("eth_getCode", [contract, hex(mid)])

              if code == "0x":
                  low = mid + 1
              else:
                  high = mid

          deployment = low
          print("Deployment block:", deployment, flush=True)

          signatures = {
              "granted": topic("RoleGranted(bytes32,address,address)"),
              "revoked": topic("RoleRevoked(bytes32,address,address)"),
              "cust_added": topic("CustodianAddressAdded(address)"),
              "cust_removed": topic("CustodianAddressRemoved(address)")
          }

          minter_role = topic("MINTER_ROLE")

          def etherscan_logs(event_topic, indexed_topic=None):
              page = 1
              all_logs = []

              while True:
                  params = {
                      "chainid": "1",
                      "module": "logs",
                      "action": "getLogs",
                      "fromBlock": str(deployment),
                      "toBlock": str(latest),
                      "address": contract,
                      "topic0": event_topic,
                      "page": str(page),
                      "offset": "1000",
                      "apikey": api_key
                  }

                  if indexed_topic:
                      params["topic0_1_opr"] = "and"
                      params["topic1"] = indexed_topic

                  url = (
                      "https://api.etherscan.io/v2/api?"
                      + urllib.parse.urlencode(params)
                  )

                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "P301-research/1.0"}
                  )

                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.load(response)

                  if data.get("status") != "1":
                      message = str(data.get("result", ""))

                      if "no records found" in message.lower():
                          break

                      raise RuntimeError(
                          "Etherscan logs API error: "
                          + str(data.get("message"))
                          + " "
                          + message
                      )

                  records = data["result"]

                  if not isinstance(records, list):
                      raise RuntimeError("Unexpected logs API response")

                  all_logs.extend(records)

                  print(
                      f"Event {event_topic[:12]} page {page}: "
                      f"{len(records)} records",
                      flush=True
                  )

                  if len(records) < 1000:
                      break

                  page += 1
                  time.sleep(0.4)

              return all_logs

          granted = etherscan_logs(
              signatures["granted"], minter_role
          )
          revoked = etherscan_logs(
              signatures["revoked"], minter_role
          )
          cust_added = etherscan_logs(signatures["cust_added"])
          cust_removed = etherscan_logs(signatures["cust_removed"])

          def ordered(log):
              return (
                  int(log["blockNumber"], 16),
                  int(log["logIndex"], 16)
              )

          minters = set()

          for log in sorted(granted + revoked, key=ordered):
              topics = log.get("topics", [])

              if len(topics) < 3:
                  raise RuntimeError("Unexpected role event format")

              account = "0x" + topics[2][-40:]
              account = account.lower()

              if topics[0].lower() == signatures["granted"]:
                  minters.add(account)
              elif topics[0].lower() == signatures["revoked"]:
                  minters.discard(account)

          custodians = set()

          for log in sorted(cust_added + cust_removed, key=ordered):
              topics = log.get("topics", [])

              if len(topics) < 2:
                  raise RuntimeError("Unexpected custodian event format")

              account = ("0x" + topics[1][-40:]).lower()

              if topics[0].lower() == signatures["cust_added"]:
                  custodians.add(account)
              elif topics[0].lower() == signatures["cust_removed"]:
                  custodians.discard(account)

          if not minters:
              raise RuntimeError("No MINTER candidates found")

          if not custodians:
              raise RuntimeError("No custodian candidates found")

          with open("/tmp/p301_minters.txt", "w") as f:
              f.write("\n".join(sorted(minters)) + "\n")

          with open("/tmp/p301_custodians.txt", "w") as f:
              f.write("\n".join(sorted(custodians)) + "\n")

          print("Minter candidates:", len(minters), flush=True)
          print("Custodian candidates:", len(custodians), flush=True)
          PY

          MINTING="0xe3490297a08d6fC8Da46Edb7B6142E4F461b62D3"
          MINTER_ROLE="$(cast keccak 'MINTER_ROLE')"

          P30_MINTER=""

          while read -r address; do
            result="$(cast call \
              "$MINTING" \
              "hasRole(bytes32,address)(bool)" \
              "$MINTER_ROLE" \
              "$address" \
              --rpc-url "$ETHENA_FORK_RPC")"

            if [ "$result" = "true" ]; then
              P30_MINTER="$address"
              break
            fi
          done < /tmp/p301_minters.txt

          test -n "$P30_MINTER" || {
            echo "No active MINTER_ROLE holder verified"
            exit 1
          }

          P30_CUSTODIAN=""

          while read -r address; do
            result="$(cast call \
              "$MINTING" \
              "isCustodianAddress(address)(bool)" \
              "$address" \
              --rpc-url "$ETHENA_FORK_RPC")"

            if [ "$result" = "true" ]; then
              P30_CUSTODIAN="$address"
              break
            fi
          done < /tmp/p301_custodians.txt

          test -n "$P30_CUSTODIAN" || {
            echo "No active custodian verified"
            exit 1
          }

          echo "Verified MINTER: $P30_MINTER"
          echo "Verified CUSTODIAN: $P30_CUSTODIAN"

          echo "P30_MINTER=$P30_MINTER" >> "$GITHUB_ENV"
          echo "P30_CUSTODIAN=$P30_CUSTODIAN" >> "$GITHUB_ENV"

      - name: Create isolated Foundry project
        run: |
          set -euo pipefail

          rm -rf /tmp/p301
          mkdir -p /tmp/p301
          cd /tmp/p301

          forge init --force .
          rm -rf test
          mkdir -p test

          cp \
            "$GITHUB_WORKSPACE/test/P30_1_MintWETHAccountingDiscovery.t.sol" \
            test/P30_1_MintWETHAccountingDiscovery.t.sol

          forge install foundry-rs/forge-std --no-commit

      - name: Verify environment
        run: |
          test -n "$P30_MINTER"
          test -n "$P30_CUSTODIAN"
          echo "Verified MINTER: $P30_MINTER"
          echo "Verified CUSTODIAN: $P30_CUSTODIAN"

      - name: Run P30.1 accounting test
        working-directory: /tmp/p301
        env:
          ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}
        run: |
          forge test \
            --match-contract P301MintWETHAccountingDiscoveryTest \
            -vvv

      - name: Completion
        if: success()
        run: |
          echo "P30.1 STATUS: TESTS PASSED"
          echo "A passing test is not proof of a vulnerability."
          echo "Any finding requires reproducible unauthorized economic impact."
