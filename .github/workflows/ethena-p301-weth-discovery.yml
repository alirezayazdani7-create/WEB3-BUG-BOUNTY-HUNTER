name: Ethena P30.1 WETH Accounting Discovery

on:
  workflow_dispatch:

jobs:
  p301:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Discover MINTER and CUSTODIAN
        env:
          ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}
        run: |
          set -e

          MINTING="0xe3490297a08d6fC8Da46Edb7B6142E4F461b62D3"

          export MINTER_ROLE="$(cast keccak 'MINTER_ROLE')"
          export ROLE_GRANTED="$(cast keccak 'RoleGranted(bytes32,address,address)')"
          export ROLE_REVOKED="$(cast keccak 'RoleRevoked(bytes32,address,address)')"
          export CUST_ADDED="$(cast keccak 'CustodianAddressAdded(address)')"
          export CUST_REMOVED="$(cast keccak 'CustodianAddressRemoved(address)')"

          python3 <<'PY'
          import os
          import json
          import urllib.request

          rpc = os.environ["ETHENA_FORK_RPC"]
          minting = "0xe3490297a08d6fC8Da46Edb7B6142E4F461b62D3"

          minter_role = os.environ["MINTER_ROLE"]
          role_granted = os.environ["ROLE_GRANTED"]
          role_revoked = os.environ["ROLE_REVOKED"]
          cust_added = os.environ["CUST_ADDED"]
          cust_removed = os.environ["CUST_REMOVED"]

          def rpc_call(method, params):
              body = json.dumps({
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": method,
                  "params": params
              }).encode()

              req = urllib.request.Request(
                  rpc,
                  data=body,
                  headers={"Content-Type": "application/json"}
              )

              with urllib.request.urlopen(req) as response:
                  result = json.load(response)

              if "error" in result:
                  raise RuntimeError(result["error"])

              return result["result"]

          latest = int(
              rpc_call("eth_blockNumber", []),
              16
          )

          def get_logs(start, end, topics):
              try:
                  return rpc_call(
                      "eth_getLogs",
                      [{
                          "fromBlock": hex(start),
                          "toBlock": hex(end),
                          "address": minting,
                          "topics": topics
                      }]
                  )
              except Exception:
                  if start >= end:
                      raise

                  mid = (start + end) // 2

                  left = get_logs(start, mid, topics)
                  right = get_logs(mid + 1, end, topics)

                  return left + right

          role_logs = get_logs(
              0,
              latest,
              [
                  [role_granted, role_revoked],
                  minter_role
              ]
          )

          active_minters = set()

          for log in sorted(
              role_logs,
              key=lambda x: (
                  int(x["blockNumber"], 16),
                  int(x["logIndex"], 16)
              )
          ):
              event = log["topics"][0].lower()
              account = "0x" + log["topics"][2][-40:]

              if event == role_granted.lower():
                  active_minters.add(account.lower())

              elif event == role_revoked.lower():
                  active_minters.discard(account.lower())

          cust_logs = get_logs(
              0,
              latest,
              [
                  [cust_added, cust_removed]
              ]
          )

          active_custodians = set()

          for log in sorted(
              cust_logs,
              key=lambda x: (
                  int(x["blockNumber"], 16),
                  int(x["logIndex"], 16)
              )
          ):
              event = log["topics"][0].lower()
              account = "0x" + log["topics"][1][-40:]

              if event == cust_added.lower():
                  active_custodians.add(account.lower())

              elif event == cust_removed.lower():
                  active_custodians.discard(account.lower())

          if not active_minters:
              raise RuntimeError(
                  "P301: no MINTER_ROLE holder discovered"
              )

          if not active_custodians:
              raise RuntimeError(
                  "P301: no custodian discovered"
              )

          with open("/tmp/p301_minters.txt", "w") as f:
              for address in sorted(active_minters):
                  f.write(address + "\n")

          with open("/tmp/p301_custodians.txt", "w") as f:
              for address in sorted(active_custodians):
                  f.write(address + "\n")

          print("=== DISCOVERED MINTERS ===")

          for address in sorted(active_minters):
              print(address)

          print("=== DISCOVERED CUSTODIANS ===")

          for address in sorted(active_custodians):
              print(address)
          PY

          P30_MINTER=""

          while read -r address; do

            result=$(cast call \
              "$MINTING" \
              "hasRole(bytes32,address)(bool)" \
              "$MINTER_ROLE" \
              "$address" \
              --rpc-url "$ETHENA_FORK_RPC")

            if echo "$result" | grep -qi "true"; then
              P30_MINTER="$address"
              break
            fi

          done < /tmp/p301_minters.txt

          if [ -z "$P30_MINTER" ]; then
            echo "P301 ERROR: no verified MINTER"
            exit 1
          fi

          P30_CUSTODIAN=""

          while read -r address; do

            result=$(cast call \
              "$MINTING" \
              "isCustodianAddress(address)(bool)" \
              "$address" \
              --rpc-url "$ETHENA_FORK_RPC")

            if echo "$result" | grep -qi "true"; then
              P30_CUSTODIAN="$address"
              break
            fi

          done < /tmp/p301_custodians.txt

          if [ -z "$P30_CUSTODIAN" ]; then
            echo "P301 ERROR: no verified CUSTODIAN"
            exit 1
          fi

          echo "P30_MINTER=$P30_MINTER"
          echo "P30_CUSTODIAN=$P30_CUSTODIAN"

          echo "P30_MINTER=$P30_MINTER" >> "$GITHUB_ENV"
          echo "P30_CUSTODIAN=$P30_CUSTODIAN" >> "$GITHUB_ENV"

      - name: Create isolated Foundry project
        run: |
          set -e

          rm -rf /tmp/p301
          mkdir -p /tmp/p301
          cd /tmp/p301

          forge init --force .

          rm -rf test
          mkdir -p test

          cp \
            "$GITHUB_WORKSPACE/test/P30_1_MintWETHAccountingDiscovery.t.sol" \
            test/P30_1_MintWETHAccountingDiscovery.t.sol

          forge install foundry-rs/forge-std --no-commit

      - name: Verify environment
        run: |
          test -n "$P30_MINTER"
          test -n "$P30_CUSTODIAN"

          echo "Verified MINTER:"
          echo "$P30_MINTER"

          echo "Verified CUSTODIAN:"
          echo "$P30_CUSTODIAN"

      - name: Run P30.1
        working-directory: /tmp/p301
        env:
          ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}
        run: |
          forge test \
            --match-contract P301MintWETHAccountingDiscoveryTest \
            -vvv

      - name: Completion
        if: success()
        run: |
          echo "P30.1 STATUS: TESTS PASSED"
          echo "GREEN DOES NOT MEAN VULNERABILITY."
          echo "FINDING REQUIRES REPRODUCIBLE UNAUTHORIZED ECONOMIC IMPACT."
