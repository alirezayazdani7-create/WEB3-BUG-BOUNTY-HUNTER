
name: Ethena Priority Paths P26-P28

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ethena-priority-paths-p26-p28
  cancel-in-progress: false

jobs:
  priority-paths:
    name: P26-P28 Local Fork Validation
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      EXECUTION_MODE: LOCAL_FORK_ONLY
      MAINNET_TRANSACTIONS: "NONE"
      LIVE_EXECUTION: PROHIBITED
      SUBMISSION: NOT_PERFORMED
      MAINNET_RPC_URL: "https://ethereum-rpc.publicnode.com"
      MINTING: "0xe3490297a08d6fC8Da46Edb7B6142E4F461b62D3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Verify safety configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$EXECUTION_MODE" = "LOCAL_FORK_ONLY"
          test "$MAINNET_TRANSACTIONS" = "NONE"
          test "$LIVE_EXECUTION" = "PROHIBITED"
          test "$SUBMISSION" = "NOT_PERFORMED"
          echo "SAFETY_CONFIGURATION=PASS"

      - name: Verify required test files
        shell: bash
        run: |
          set -euo pipefail
          test -f test/MintingV2P26DelegatedRedeemLifecycle.t.sol
          test -f test/MintingV2P27DelegatedReaddResurrection.t.sol
          test -f test/MintingV2P28BenefactorReaddAuthorization.t.sol
          echo "REQUIRED_TEST_FILES=PASS"

      - name: Check upstream RPC
        shell: bash
        run: |
          set -euo pipefail
          CHAIN_ID="$(cast chain-id --rpc-url "$MAINNET_RPC_URL")"
          test "$CHAIN_ID" = "1"
          echo "UPSTREAM_CHAIN_ID=$CHAIN_ID"

      - name: Start isolated Anvil fork
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/anvil.log /tmp/anvil.pid

          anvil \
            --fork-url "$MAINNET_RPC_URL" \
            --chain-id 31337 \
            --host 127.0.0.1 \
            --port 8545 \
            --auto-impersonate \
            > /tmp/anvil.log 2>&1 &

          echo $! > /tmp/anvil.pid
          READY=0

          for i in $(seq 1 60); do
            if cast chain-id \
              --rpc-url http://127.0.0.1:8545 \
              >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" != "1" ]; then
            cat /tmp/anvil.log || true
            exit 1
          fi

          CHAIN_ID="$(cast chain-id \
            --rpc-url http://127.0.0.1:8545)"
          test "$CHAIN_ID" = "31337"
          echo "LOCAL_FORK_CHAIN_ID=$CHAIN_ID"

      - name: Verify target contract
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(cast code "$MINTING" \
            --rpc-url http://127.0.0.1:8545)"
          test "$CODE" != "0x"
          echo "TARGET_CONTRACT_CODE=FOUND"

      - name: Run P26 delegated redeem lifecycle
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --via-ir \
            --optimize \
            --fork-url http://127.0.0.1:8545 \
            --match-path test/MintingV2P26DelegatedRedeemLifecycle.t.sol \
            -vvvv

      - name: Run P27 delegated re-add lifecycle
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --via-ir \
            --optimize \
            --fork-url http://127.0.0.1:8545 \
            --match-path test/MintingV2P27DelegatedReaddResurrection.t.sol \
            -vvvv

      - name: Run P28 benefactor re-add authorization
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --via-ir \
            --optimize \
            --fork-url http://127.0.0.1:8545 \
            --match-path test/MintingV2P28BenefactorReaddAuthorization.t.sol \
            -vvvv

      - name: Verify execution restrictions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$EXECUTION_MODE" = "LOCAL_FORK_ONLY"
          test "$MAINNET_TRANSACTIONS" = "NONE"
          test "$LIVE_EXECUTION" = "PROHIBITED"
          test "$SUBMISSION" = "NOT_PERFORMED"
          echo "LIVE_EXECUTION=PROHIBITED"
          echo "MAINNET_TRANSACTIONS=NONE"
          echo "SUBMISSION=NOT_PERFORMED"

      - name: Stop isolated Anvil
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/anvil.pid ]; then
            kill "$(cat /tmp/anvil.pid)" 2>/dev/null || true
          fi

      - name: Show Anvil log on failure
        if: failure()
        shell: bash
        run: |
          cat /tmp/anvil.log || true
