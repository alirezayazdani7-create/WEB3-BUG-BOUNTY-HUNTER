name: Ethena S06 Cap Boundary Model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Create isolated Foundry project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/s06-boundary
          mkdir -p /tmp/s06-boundary
          cd /tmp/s06-boundary

          forge init --force .

          rm -rf test
          mkdir -p test

          SOURCE="$GITHUB_WORKSPACE/test/test/MintingV2S06CapBoundaryModel"

          if [ ! -f "$SOURCE" ]; then
            echo "::error::Test source file not found: $SOURCE"
            echo "Files available under test/:"
            find "$GITHUB_WORKSPACE/test" -maxdepth 4 -type f -print || true
            exit 1
          fi

          cp "$SOURCE" test/MintingV2S06CapBoundaryModel.t.sol

          forge install foundry-rs/forge-std --no-commit

      - name: Run boundary model tests
        working-directory: /tmp/s06-boundary
        shell: bash
        run: |
          set -euo pipefail

          forge test \
            --match-contract MintingV2S06CapBoundaryModelTest \
            -vvv
