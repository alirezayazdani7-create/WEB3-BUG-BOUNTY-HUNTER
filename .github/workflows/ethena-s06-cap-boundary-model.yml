
name: Ethena S06 Cap Boundary Model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Create isolated Foundry project
        run: |
          rm -rf /tmp/s06-boundary
          mkdir -p /tmp/s06-boundary
          cd /tmp/s06-boundary
          forge init --force .
          rm -rf test
          mkdir -p test
          cp "$GITHUB_WORKSPACE/test/MintingV2S06CapBoundaryModel.t.sol" test/
          forge install foundry-rs/forge-std --no-commit

      - name: Run boundary model tests
        working-directory: /tmp/s06-boundary
        run: |
          forge test \
            --match-contract MintingV2S06CapBoundaryModelTest \
            -vvv
