name: Ethena StakedUSDeV2 fuzz validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Fetch public audit package
        run: git clone --depth 1 https://github.com/chrispyspearbit/ethena-audit-package.git audit-package

      - name: Repair fuzz input generation in temporary checkout
        working-directory: audit-package/package/source/bbp-public-assets/contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("test/foundry/staking/StakedUSDeV2.cooldownEnabled.t.sol")
          source = p.read_text()

          pattern = re.compile(
              r"    vm\.assume\(\s*"
              r"amount1 >= 100 ether && amount2 > 0 && amount3 > 0 && rewardAmount > 0 && waitSeconds <= 9 hours\s*"
              r"// 100 trillion USD with 18 decimals\s*"
              r"&& amount1 < 1e32 && amount2 < 1e32 && amount3 < 1e32 && rewardAmount < 1e32\s*"
              r"\);",
              re.MULTILINE,
          )

          replacement = """    amount1 = bound(amount1, 100 ether, 1e32 - 1);
              amount2 = bound(amount2, 1, 1e32 - 1);
              amount3 = bound(amount3, 1, 1e32 - 1);
              rewardAmount = bound(rewardAmount, 1, 1e32 - 1);
              waitSeconds = bound(waitSeconds, 0, 9 hours);"""

          source, count = pattern.subn(replacement, source, count=1)

          if count != 1:
              raise SystemExit(
                  f"Expected one fuzz block in {p}, found {count}; no test changes applied."
              )

          p.write_text(source)
          print(f"Patched fuzz input generation in temporary checkout: {p}")
          PY

      - name: Run all StakedUSDeV2 tests
        working-directory: audit-package/package/source/bbp-public-assets/contracts
        run: forge test --match-path "test/foundry/staking/StakedUSDeV2*.t.sol" -vv
