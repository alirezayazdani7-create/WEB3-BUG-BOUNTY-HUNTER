      - name: Run P15 scaling tests
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "RUNNING P15"
          echo "=============================================="

          echo "FORK=http://127.0.0.1:8545"
          echo "CHAIN_ID=$(cast chain-id --rpc-url http://127.0.0.1:8545)"

          echo "MAINNET_TRANSACTIONS=NONE"
          echo "LIVE_EXECUTION=PROHIBITED"
          echo "SUBMISSION=NOT_PERFORMED"

          forge test \
            --via-ir \
            --fork-url http://127.0.0.1:8545 \
            --match-path test/MintingV2P15Scaling.t.sol \
            -vvvvv
