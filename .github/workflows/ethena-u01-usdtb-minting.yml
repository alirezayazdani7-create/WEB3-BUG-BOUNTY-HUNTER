name: Ethena U01 USDtb Minting

on:
  workflow_dispatch:

jobs:
  u01:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Create isolated Foundry project
        run: |
          rm -rf /tmp/u01
          mkdir -p /tmp/u01
          cd /tmp/u01
          forge init --force .
          rm -rf test
          mkdir test
          cp "$GITHUB_WORKSPACE/test/U01USDtbMintingProbe.t.sol" test/
          forge install foundry-rs/forge-std --no-commit

      - name: Run U01
        working-directory: /tmp/u01
        env:
          ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}
        run: |
          forge test \
            --match-contract U01USDtbMintingProbe \
            -vvv
