
name: Ethena S06 Cumulative Cap Enforcement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test/EthenaS06CumulativeCapEnforcement.t.sol'
      - '.github/workflows/ethena-s06-cumulative-cap-enforcement.yml'

permissions:
  contents: read

jobs:
  cumulative-cap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check RPC secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ETHENA_FORK_RPC:-}" || {
            echo "::error::ETHENA_FORK_RPC secret is missing"
            exit 1
          }

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Prepare isolated Foundry project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/s06-cumulative
          mkdir -p /tmp/s06-cumulative
          cd /tmp/s06-cumulative
          forge init --force .
          rm -rf test
          mkdir -p test
          cp "$GITHUB_WORKSPACE/test/EthenaS06CumulativeCapEnforcement.t.sol" test/
          forge install foundry-rs/forge-std --no-commit

      - name: Run local-fork cumulative cap tests
        working-directory: /tmp/s06-cumulative
        shell: bash
        run: |
          set -euo pipefail
          echo "MODE=LOCAL_FORK_ONLY"
          echo "MAINNET_TRANSACTIONS=NONE"
          forge test \
            --match-contract EthenaS06CumulativeCapEnforcementTest \
            --via-ir --optimize -vvv
