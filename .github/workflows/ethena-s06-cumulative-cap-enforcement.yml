name: Ethena S06 Cumulative Cap + Redemption Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'test/EthenaS06CumulativeCapEnforcement.t.sol'
      - 'test/EthenaS06MultiAssetProbe.t.sol'
      - 'test/EthenaS06MultiAssetCumulativeCap.t.sol'
      - 'test/EthenaS06RedeemCapProbe.t.sol'
      - '.github/workflows/ethena-s06-cumulative-cap-enforcement.yml'

permissions:
  contents: read

jobs:
  cumulative-cap-and-redemption-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check RPC secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ETHENA_FORK_RPC:-}" ]; then
            echo "::error::ETHENA_FORK_RPC secret is missing"
            exit 1
          fi
          echo "RPC secret is configured."

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Prepare isolated Foundry project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/s06-cumulative
          mkdir -p /tmp/s06-cumulative
          cd /tmp/s06-cumulative

          forge init --force .
          rm -rf test
          mkdir -p test

          cp "$GITHUB_WORKSPACE/test/EthenaS06CumulativeCapEnforcement.t.sol" test/
          cp "$GITHUB_WORKSPACE/test/EthenaS06MultiAssetProbe.t.sol" test/
          cp "$GITHUB_WORKSPACE/test/EthenaS06MultiAssetCumulativeCap.t.sol" test/
          cp "$GITHUB_WORKSPACE/test/EthenaS06RedeemCapProbe.t.sol" test/

          forge install foundry-rs/forge-std --no-commit

      - name: Run cumulative cap enforcement tests
        working-directory: /tmp/s06-cumulative
        shell: bash
        run: |
          set -euo pipefail
          echo "MODE=LOCAL_FORK_ONLY"
          echo "MAINNET_TRANSACTIONS=NONE"

          forge test \
            --match-contract EthenaS06CumulativeCapEnforcementTest \
            --via-ir --optimize -vvv

      - name: Run read-only multi-asset probe
        working-directory: /tmp/s06-cumulative
        shell: bash
        run: |
          set -euo pipefail
          echo "MODE=READ_ONLY_LOCAL_FORK"
          echo "MAINNET_TRANSACTIONS=NONE"

          forge test \
            --match-contract EthenaS06MultiAssetProbeTest \
            --via-ir --optimize -vvv

      - name: Run cross-asset global cap test
        working-directory: /tmp/s06-cumulative
        shell: bash
        run: |
          set -euo pipefail
          echo "MODE=LOCAL_FORK_ONLY"
          echo "MAINNET_TRANSACTIONS=NONE"

          forge test \
            --match-contract EthenaS06MultiAssetCumulativeCapTest \
            --via-ir --optimize -vvv

      - name: Run read-only redemption cap probe
        working-directory: /tmp/s06-cumulative
        shell: bash
        run: |
          set -euo pipefail
          echo "MODE=READ_ONLY_LOCAL_FORK"
          echo "MAINNET_TRANSACTIONS=NONE"

          forge test \
            --match-contract EthenaS06RedeemCapProbeTest \
            --via-ir --optimize -vvv
