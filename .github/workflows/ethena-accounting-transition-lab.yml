FORENSIC ROOT CAUSE
-------------------
The existing A04 test incorrectly compares:

Vault_before + Silo_before

against:

Vault_after + Silo_after

after unstake.

That is NOT a valid conservation invariant because unstake intentionally transfers
USDe from the USDeSilo to the external receiver.

The previous Run #7 produced:

A04_PENDING_BEFORE_UNSTAKE
= 1251811497904328062

A04_RECEIVER_DELTA
= 1251811497904328062

A04_SILO_OUTFLOW
= 0

A04_RAW_BACKING_BEFORE
= 1251113124749443396420042609

A04_RAW_BACKING_AFTER
= 1251113123497631898515714547

The decrease in measured Vault+Silo backing was:

1251811497904328062

which exactly equals:

A04_PENDING_BEFORE_UNSTAKE
and
A04_RECEIVER_DELTA

Therefore the apparent accounting loss was caused by the LAB'S INVALID
measurement boundary, not evidence of a protocol loss.

CORRECT ACCOUNTING MODEL
------------------------

During cooldown:

Vault_before
+
Silo_before
=
Vault_after_cooldown
+
Silo_before_unstake

During unstake:

Silo_before_unstake
=
Silo_after_unstake
+
Receiver_delta

For the entire A04 cycle:

Vault_before
+
Silo_before
=
Vault_after
+
Silo_after
+
Receiver_delta

This is the invariant that must be tested.

