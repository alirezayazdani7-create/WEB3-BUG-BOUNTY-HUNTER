name: Ethena Minting V2 P14 Full Path

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p14-full-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EXECUTION_MODE: LOCAL_FORK_ONLY
      MAINNET_TRANSACTIONS: "NONE"
      LIVE_EXECUTION: PROHIBITED
      SUBMISSION: NOT_PERFORMED

      MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com

      MINTING: 0xe3490297a08d6fC8Da46Edb7B6142E4F461b62D3
      USDE: 0x4c9EDD5852cd905f086C759E8383e09bff1E68B3
      USDC: 0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48

      LOCAL_TESTER: 0x7E5F4552091A69125d5DfCb7b8C2659029395Bdf

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1


      - name: Start isolated Anvil fork
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "PARSA / ETHENA P14"
          echo "=============================================="

          echo "EXECUTION_MODE=${EXECUTION_MODE}"
          echo "MAINNET_TRANSACTIONS=${MAINNET_TRANSACTIONS}"
          echo "LIVE_EXECUTION=${LIVE_EXECUTION}"
          echo "SUBMISSION=${SUBMISSION}"

          echo ""
          echo "Starting isolated Ethereum Mainnet fork..."
          echo ""

          anvil \
            --fork-url "${MAINNET_RPC_URL}" \
            --chain-id 31337 \
            --host 127.0.0.1 \
            --port 8545 \
            --auto-impersonate \
            > /tmp/anvil.log 2>&1 &

          ANVIL_PID=$!

          echo "ANVIL_PID=${ANVIL_PID}"

          for i in $(seq 1 30); do
            if cast chain-id \
              --rpc-url http://127.0.0.1:8545 \
              >/dev/null 2>&1; then
              break
            fi

            sleep 1
          done

          CHAIN_ID="$(
            cast chain-id \
              --rpc-url http://127.0.0.1:8545
          )"

          echo "LOCAL_CHAIN_ID=${CHAIN_ID}"

          test "${CHAIN_ID}" = "31337"

          echo "ANVIL_READY=PASS"


      - name: Inspect deployed Minting V2 state
        shell: bash
        run: |
          set -euo pipefail

          RPC="http://127.0.0.1:8545"

          echo "=============================================="
          echo "DEPLOYED MINTING V2 STATE"
          echo "=============================================="

          echo ""
          echo "Minting:"
          echo "${MINTING}"

          echo ""
          echo "USDe:"
          cast call \
            "${MINTING}" \
            "usde()(address)" \
            --rpc-url "${RPC}"

          echo ""
          echo "Owner:"
          OWNER="$(
            cast call \
              "${MINTING}" \
              "owner()(address)" \
              --rpc-url "${RPC}"
          )"

          echo "OWNER=${OWNER}"

          test -n "${OWNER}"

          echo ""
          echo "Owner balance:"
          cast balance \
            "${OWNER}" \
            --rpc-url "${RPC}"


      - name: Configure only the local fork
        shell: bash
        run: |
          set -euo pipefail

          RPC="http://127.0.0.1:8545"

          OWNER="$(
            cast call \
              "${MINTING}" \
              "owner()(address)" \
              --rpc-url "${RPC}"
          )"

          echo "Using deployed owner:"
          echo "${OWNER}"

          echo ""
          echo "Impersonating owner on LOCAL FORK only..."

          cast rpc \
            --rpc-url "${RPC}" \
            anvil_impersonateAccount \
            "${OWNER}"

          MINTER_ROLE="$(
            cast keccak "MINTER_ROLE"
          )"

          echo ""
          echo "MINTER_ROLE=${MINTER_ROLE}"

          echo ""
          echo "Granting MINTER_ROLE to local tester..."

          cast send \
            --unlocked \
            --from "${OWNER}" \
            "${MINTING}" \
            "grantRole(bytes32,address)" \
            "${MINTER_ROLE}" \
            "${LOCAL_TESTER}" \
            --rpc-url "${RPC}"

          echo ""
          echo "Whitelisting local tester as benefactor..."

          cast send \
            --unlocked \
            --from "${OWNER}" \
            "${MINTING}" \
            "addWhitelistedBenefactor(address)" \
            "${LOCAL_TESTER}" \
            --rpc-url "${RPC}"

          echo ""
          echo "Checking MINTER_ROLE..."

          HAS_ROLE="$(
            cast call \
              "${MINTING}" \
              "hasRole(bytes32,address)(bool)" \
              "${MINTER_ROLE}" \
              "${LOCAL_TESTER}" \
              --rpc-url "${RPC}"
          )"

          echo "HAS_MINTER_ROLE=${HAS_ROLE}"

          test "${HAS_ROLE}" = "true"

          echo ""
          echo "Checking benefactor whitelist..."

          WHITELISTED="$(
            cast call \
              "${MINTING}" \
              "isWhitelistedBenefactor(address)(bool)" \
              "${LOCAL_TESTER}" \
              --rpc-url "${RPC}"
          )"

          echo "IS_WHITELISTED_BENEFACTOR=${WHITELISTED}"

          test "${WHITELISTED}" = "true"

          echo ""
          echo "LOCAL_AUTHORIZATION=PASS"


      - name: Run P14 full-path tests
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "RUNNING P14 FULL MINT PATH"
          echo "=============================================="

          echo ""
          echo "Fork:"
          echo "http://127.0.0.1:8545"

          echo ""
          echo "Chain ID:"
          cast chain-id \
            --rpc-url http://127.0.0.1:8545

          echo ""
          echo "Execution:"
          echo "LOCAL FORK ONLY"

          echo ""
          echo "Mainnet transactions:"
          echo "NONE"

          echo ""
          echo "Live execution:"
          echo "PROHIBITED"

          echo ""
          echo "Running Foundry..."

          forge test \
            --fork-url http://127.0.0.1:8545 \
            --match-path test/MintingV2P14FullPath.t.sol \
            -vvvvv


      - name: Final safety assertion
        shell: bash
        run: |
          set -euo pipefail

          test "${EXECUTION_MODE}" = "LOCAL_FORK_ONLY"

          test "${MAINNET_TRANSACTIONS}" = "NONE"

          test "${LIVE_EXECUTION}" = "PROHIBITED"

          test "${SUBMISSION}" = "NOT_PERFORMED"

          echo ""
          echo "=============================================="
          echo "SAFETY_STATUS=PASS"
          echo "=============================================="


      - name: Dump Anvil log on failure
        if: failure()
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "ANVIL LOG"
          echo "=============================================="

          cat /tmp/anvil.log || true
