
name: Ethena Minting V2 P14 Full Path

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p14-full-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EXECUTION_MODE: LOCAL_FORK_ONLY
      MAINNET_TRANSACTIONS: "NONE"
      LIVE_EXECUTION: PROHIBITED
      SUBMISSION: NOT_PERFORMED
      MAINNET_RPC_URL: "https://ethereum-rpc.publicnode.com"
      MINTING: "0xe3490297a08d6fC8Da46Edb7B6142E4F461b62D3"
      USDE: "0x4c9EDD5852cd905f086C759E8383e09bff1E68B3"
      USDC: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
      LOCAL_TESTER: "0x7E5F4552091A69125d5DfCb7b8C2659029395Bdf"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Start isolated Anvil fork
        shell: bash
        run: |
          set -euo pipefail

          echo "EXECUTION_MODE=${EXECUTION_MODE}"
          echo "MAINNET_TRANSACTIONS=${MAINNET_TRANSACTIONS}"
          echo "LIVE_EXECUTION=${LIVE_EXECUTION}"
          echo "SUBMISSION=${SUBMISSION}"

          anvil \
            --fork-url "${MAINNET_RPC_URL}" \
            --chain-id 31337 \
            --host 127.0.0.1 \
            --port 8545 \
            --auto-impersonate \
            > /tmp/anvil.log 2>&1 &

          for i in $(seq 1 30); do
            if cast chain-id \
              --rpc-url http://127.0.0.1:8545 \
              >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          CHAIN_ID="$(
            cast chain-id \
              --rpc-url http://127.0.0.1:8545
          )"

          echo "LOCAL_CHAIN_ID=${CHAIN_ID}"
          test "${CHAIN_ID}" = "31337"
          echo "ANVIL_READY=PASS"

      - name: Inspect deployed Minting V2 state
        shell: bash
        run: |
          set -euo pipefail
          RPC="http://127.0.0.1:8545"

          echo "Minting: ${MINTING}"

          cast call \
            "${MINTING}" \
            "usde()(address)" \
            --rpc-url "${RPC}"

          OWNER="$(
            cast call \
              "${MINTING}" \
              "owner()(address)" \
              --rpc-url "${RPC}"
          )"

          echo "OWNER=${OWNER}"
          test -n "${OWNER}"

          cast balance "${OWNER}" --rpc-url "${RPC}"

      - name: Configure only the local fork
        shell: bash
        run: |
          set -euo pipefail
          RPC="http://127.0.0.1:8545"

          OWNER="$(
            cast call \
              "${MINTING}" \
              "owner()(address)" \
              --rpc-url "${RPC}"
          )"

          cast rpc \
            --rpc-url "${RPC}" \
            anvil_impersonateAccount \
            "${OWNER}"

          cast rpc \
            --rpc-url "${RPC}" \
            anvil_setBalance \
            "${OWNER}" \
            "0x3635C9ADC5DEA0000000"

          MINTER_ROLE="$(cast keccak "MINTER_ROLE")"

          cast send \
            --unlocked \
            --from "${OWNER}" \
            "${MINTING}" \
            "grantRole(bytes32,address)" \
            "${MINTER_ROLE}" \
            "${LOCAL_TESTER}" \
            --rpc-url "${RPC}"

          cast send \
            --unlocked \
            --from "${OWNER}" \
            "${MINTING}" \
            "addWhitelistedBenefactor(address)" \
            "${LOCAL_TESTER}" \
            --rpc-url "${RPC}"

          HAS_ROLE="$(
            cast call \
              "${MINTING}" \
              "hasRole(bytes32,address)(bool)" \
              "${MINTER_ROLE}" \
              "${LOCAL_TESTER}" \
              --rpc-url "${RPC}"
          )"

          echo "HAS_MINTER_ROLE=${HAS_ROLE}"
          test "${HAS_ROLE}" = "true"

          WHITELISTED="$(
            cast call \
              "${MINTING}" \
              "isWhitelistedBenefactor(address)(bool)" \
              "${LOCAL_TESTER}" \
              --rpc-url "${RPC}"
          )"

          echo "IS_WHITELISTED_BENEFACTOR=${WHITELISTED}"
          test "${WHITELISTED}" = "true"

          echo "LOCAL_AUTHORIZATION=PASS"

      - name: Verify test files exist
        shell: bash
        run: |
          set -euo pipefail

          test -f test/MintingV2P14FullPath.t.sol
          test -f test/MintingV2P14LargeAmountFullPath.t.sol

          echo "OLD_P14_TEST_FILE=FOUND"
          echo "LARGE_P14_TEST_FILE=FOUND"

      - name: Run P14 full-path tests
        shell: bash
        run: |
          set -euo pipefail

          RPC="http://127.0.0.1:8545"

          echo "EXECUTION_MODE=LOCAL_FORK_ONLY"
          echo "MAINNET_TRANSACTIONS=NONE"
          echo "LIVE_EXECUTION=PROHIBITED"

          cast chain-id --rpc-url "${RPC}"

          forge test \
            --fork-url "${RPC}" \
            --match-path 'test/MintingV2P14*FullPath.t.sol' \
            -vvvvv

      - name: Final safety assertion
        shell: bash
        run: |
          set -euo pipefail

          test "${EXECUTION_MODE}" = "LOCAL_FORK_ONLY"
          test "${MAINNET_TRANSACTIONS}" = "NONE"
          test "${LIVE_EXECUTION}" = "PROHIBITED"
          test "${SUBMISSION}" = "NOT_PERFORMED"

          echo "SAFETY_STATUS=PASS"

      - name: Dump Anvil log on failure
        if: failure()
        shell: bash
        run: |
          cat /tmp/anvil.log || true
