name: Fork Validation Lab

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ============================================================
  # 1) RPC PREFLIGHT
  # ============================================================
  rpc-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Test Ethereum RPC
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          set -euo pipefail

          test -n "$ETH_RPC_URL"

          echo "RPC_SECRET_PRESENT=YES"

          echo "FOUNDRY_VERSION:"
          forge --version

          echo "CAST_VERSION:"
          cast --version

          echo "ANVIL_VERSION:"
          anvil --version

          echo "MAINNET_CHAIN_ID:"
          MAIN_CHAIN_ID="$(cast chain-id --rpc-url "$ETH_RPC_URL")"
          echo "$MAIN_CHAIN_ID"

          test "$MAIN_CHAIN_ID" = "1"

          echo "MAINNET_BLOCK:"
          MAIN_BLOCK="$(cast block-number --rpc-url "$ETH_RPC_URL")"
          echo "$MAIN_BLOCK"

          test "$MAIN_BLOCK" -gt 0

          echo "RPC_PREFLIGHT=PASS"


  # ============================================================
  # 2) REAL LOCAL MAINNET FORK
  # ============================================================
  fork-smoke:
    needs: rpc-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # --------------------------------------------------------
      # Start Anvil as an isolated local fork
      # --------------------------------------------------------
      - name: Start isolated Ethereum Mainnet Fork
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          set -euo pipefail

          test -n "$ETH_RPC_URL"

          rm -f anvil.log
          rm -f anvil.pid

          echo "STARTING_ANVIL_FORK..."

          anvil \
            --fork-url "$ETH_RPC_URL" \
            --host 127.0.0.1 \
            --port 8545 \
            --chain-id 31337 \
            --accounts 2 \
            > anvil.log 2>&1 &

          ANVIL_PID=$!
          echo "$ANVIL_PID" > anvil.pid

          echo "ANVIL_PID=$ANVIL_PID"

          echo "WAITING_FOR_LOCAL_RPC..."

          READY=0

          for i in $(seq 1 30); do
            if cast chain-id \
              --rpc-url http://127.0.0.1:8545 \
              >/dev/null 2>&1; then

              READY=1
              echo "LOCAL_RPC_READY=YES"
              break
            fi

            sleep 1
          done

          if [ "$READY" != "1" ]; then
            echo "LOCAL_RPC_READY=NO"
            echo "===== ANVIL LOG ====="
            cat anvil.log || true
            exit 1
          fi

          echo
          echo "LOCAL_CHAIN_ID:"
          LOCAL_CHAIN_ID="$(cast chain-id --rpc-url http://127.0.0.1:8545)"
          echo "$LOCAL_CHAIN_ID"

          test "$LOCAL_CHAIN_ID" = "31337"

          echo
          echo "FORK_BLOCK:"
          FORK_BLOCK="$(cast block-number --rpc-url http://127.0.0.1:8545)"
          echo "$FORK_BLOCK"

          test "$FORK_BLOCK" -gt 0

          echo
          echo "FORK_LATEST_HASH:"
          cast block latest \
            --rpc-url http://127.0.0.1:8545 \
            --json | head -c 500

          echo
          echo
          echo "ANVIL_FORK=PASS"


      # --------------------------------------------------------
      # Verify that the local node is NOT the main RPC
      # --------------------------------------------------------
      - name: Verify fork isolation
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          set -euo pipefail

          echo "READING_MAINNET_CHAIN_ID..."

          MAIN_CHAIN_ID="$(cast chain-id \
            --rpc-url "$ETH_RPC_URL")"

          echo "MAINNET_CHAIN_ID=$MAIN_CHAIN_ID"

          test "$MAIN_CHAIN_ID" = "1"

          echo
          echo "READING_LOCAL_CHAIN_ID..."

          LOCAL_CHAIN_ID="$(cast chain-id \
            --rpc-url http://127.0.0.1:8545)"

          echo "LOCAL_FORK_CHAIN_ID=$LOCAL_CHAIN_ID"

          test "$LOCAL_CHAIN_ID" = "31337"

          echo
          echo "CHECKING_LOCAL_BLOCK..."

          LOCAL_BLOCK="$(cast block-number \
            --rpc-url http://127.0.0.1:8545)"

          echo "LOCAL_FORK_BLOCK=$LOCAL_BLOCK"

          test "$LOCAL_BLOCK" -gt 0

          echo
          echo "CHECKING_MAINNET_BLOCK..."

          MAIN_BLOCK="$(cast block-number \
            --rpc-url "$ETH_RPC_URL")"

          echo "MAINNET_BLOCK=$MAIN_BLOCK"

          test "$MAIN_BLOCK" -gt 0

          echo
         
