name: Fork Validation Lab

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rpc-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Test Ethereum RPC
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          set -euo pipefail
          test -n "$ETH_RPC_URL"

          echo "RPC_SECRET_PRESENT=YES"
          forge --version
          cast --version
          anvil --version

          MAIN_CHAIN_ID="$(cast chain-id --rpc-url "$ETH_RPC_URL")"
          echo "MAINNET_CHAIN_ID=$MAIN_CHAIN_ID"
          test "$MAIN_CHAIN_ID" = "1"

          MAIN_BLOCK="$(cast block-number --rpc-url "$ETH_RPC_URL")"
          echo "MAINNET_BLOCK=$MAIN_BLOCK"
          test "$MAIN_BLOCK" -gt 0

          echo "RPC_PREFLIGHT=PASS"

  fork-smoke:
    needs: rpc-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Start isolated Ethereum Mainnet Fork
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          set -euo pipefail

          test -n "$ETH_RPC_URL"

          rm -f anvil.log anvil.pid

          anvil \
            --fork-url "$ETH_RPC_URL" \
            --host 127.0.0.1 \
            --port 8545 \
            --chain-id 31337 \
            --accounts 2 \
            > anvil.log 2>&1 &

          ANVIL_PID=$!
          echo "$ANVIL_PID" > anvil.pid

          READY=0

          for i in $(seq 1 30); do
            if cast chain-id \
              --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          test "$READY" = "1"

          LOCAL_CHAIN_ID="$(cast chain-id \
            --rpc-url http://127.0.0.1:8545)"

          echo "LOCAL_CHAIN_ID=$LOCAL_CHAIN_ID"
          test "$LOCAL_CHAIN_ID" = "31337"

          FORK_BLOCK="$(cast block-number \
            --rpc-url http://127.0.0.1:8545)"

          echo "FORK_BLOCK=$FORK_BLOCK"
          test "$FORK_BLOCK" -gt 0

          echo "ANVIL_FORK=PASS"

      - name: Verify fork isolation
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          set -euo pipefail

          MAIN_CHAIN_ID="$(cast chain-id \
            --rpc-url "$ETH_RPC_URL")"

          LOCAL_CHAIN_ID="$(cast chain-id \
            --rpc-url http://127.0.0.1:8545)"

          MAIN_BLOCK="$(cast block-number \
            --rpc-url "$ETH_RPC_URL")"

          LOCAL_BLOCK="$(cast block-number \
            --rpc-url http://127.0.0.1:8545)"

          echo "MAINNET_CHAIN_ID=$MAIN_CHAIN_ID"
          echo "LOCAL_FORK_CHAIN_ID=$LOCAL_CHAIN_ID"
          echo "MAINNET_BLOCK=$MAIN_BLOCK"
          echo "LOCAL_FORK_BLOCK=$LOCAL_BLOCK"

          test "$MAIN_CHAIN_ID" = "1"
          test "$LOCAL_CHAIN_ID" = "31337"
          test "$MAIN_BLOCK" -gt 0
          test "$LOCAL_BLOCK" -gt 0

          echo "ISOLATION_CHECK=PASS"

      - name: Inspect Ethena contracts on local fork
        run: |
          set -euo pipefail

          USDE="0x4c9EDD5852cd905f086C759E8383e09bff1E68B3"
          SUSDE="0x9D39A5DE30e57443BfF2A8307A4256c8797A3497"

          echo "USDE_CODE_BYTES=$(cast code "$USDE" \
            --rpc-url http://127.0.0.1:8545 | wc -c)"

          echo "SUSDE_CODE_BYTES=$(cast code "$SUSDE" \
            --rpc-url http://127.0.0.1:8545 | wc -c)"

          echo "USDE_TOTAL_SUPPLY=$(cast call "$USDE" \
            "
