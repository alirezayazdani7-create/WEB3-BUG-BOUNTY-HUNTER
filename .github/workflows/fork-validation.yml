name: Fork Validation Lab

on:
  push:
    branches:
      - main
    paths:
      - "test/**"
      - "src/**"
      - "lib/**"
      - "foundry.toml"
      - ".github/workflows/fork-validation.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ethena-local-fork-validation:
    name: Ethena Local Fork Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check RPC secret
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ETHENA_FORK_RPC:-}" ]; then
            echo "::error::ETHENA_FORK_RPC secret is missing."
            exit 1
          fi

          echo "RPC secret is configured."

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Prepare Foundry project
        shell: bash
        run: |
          set -euo pipefail

          forge --version

          # Recreate the configuration so a stale compiler pin
          # cannot force all files to use Solidity 0.8.26.
          cat > foundry.toml <<'TOML'
          [profile.default]
          src = "src"
          test = "test"
          script = "script"
          out = "out"
          libs = ["lib"]
          auto_detect_solc = true
          optimizer = true
          optimizer_runs = 200

          [rpc_endpoints]
          mainnet = "${ETHENA_FORK_RPC}"
          TOML

          echo "Foundry configuration created with automatic compiler detection."

          if [ ! -d lib/forge-std/src ]; then
            mkdir -p lib
            forge install foundry-rs/forge-std --no-git
          fi

          forge build

      - name: Verify required diagnostic files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            test/P301_UnauthorizedRemovalProof.t.sol \
            test/EthenaAdminRoleDiagnostic.t.sol \
            test/P30_2_MintWETHReadOnlyDiagnostic.t.sol
          do
            if [ ! -f "$file" ]; then
              echo "::error::Required test file missing: $file"
              exit 1
            fi

            echo "Found $file"
          done

      - name: Safety declaration
        shell: bash
        run: |
          echo "Validation mode: local fork diagnostics"
          echo "No live trading or transaction submission is authorized."
          echo "Tests must not use private keys or broadcast transactions."

      - name: Run P301 unauthorized access-control test
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --match-path test/P301_UnauthorizedRemovalProof.t.sol \
            -vvvv

      - name: Run read-only admin role diagnostic
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --match-path test/EthenaAdminRoleDiagnostic.t.sol \
            -vvvv

      - name: Run P30.2 read-only WETH diagnostic
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --match-path test/P30_2_MintWETHReadOnlyDiagnostic.t.sol \
            -vvvv

      - name: Run P30.1 diagnostic if present
        if: ${{ hashFiles('test/P30_1_MintWETHAccountingInvariant.t.sol') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --match-path test/P30_1_MintWETHAccountingInvariant.t.sol \
            -vvvv

      - name: Record validation status
        if: always()
        shell: bash
        run: |
          echo "Validation workflow reached its final status step."
          echo "Inspect earlier steps to determine whether validation passed."
          echo "A passing test is not, by itself, proof of a vulnerability."
