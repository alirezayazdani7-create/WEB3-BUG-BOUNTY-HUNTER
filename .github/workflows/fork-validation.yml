name: Fork Validation Lab

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "test/**"
      - ".github/workflows/fork-validation.yml"
      - "foundry.toml"

permissions:
  contents: read

jobs:
  p301-local-fork-test:
    name: P301 Local Fork Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check RPC secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ETH_RPC_URL:-}" ]; then
            echo "::error::ETH_RPC_URL secret is missing."
            exit 1
          fi
          echo "RPC secret is configured."

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Prepare Foundry project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f foundry.toml ]; then
            cat > foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          script = "script"
          out = "out"
          libs = ["lib"]
          solc_version = "0.8.20"
          EOF
          fi
          mkdir -p lib
          if [ ! -f lib/forge-std/src/Test.sol ]; then
            forge install foundry-rs/forge-std --no-commit
          fi
          forge --version

      - name: Verify P301 access-control test
        shell: bash
        run: |
          set -euo pipefail
          test -f test/P301_UnauthorizedRemovalProof.t.sol
          grep -q "function test_UnauthorizedCannotRemoveSupportedAsset" \
            test/P301_UnauthorizedRemovalProof.t.sol
          echo "P301 access-control test found."

      - name: Run local-fork access-control test
        shell: bash
        run: |
          set -euo pipefail
          echo "LIVE_TRADING=PROHIBITED"
          echo "MAINNET_TRANSACTIONS=NONE"
          echo "TEST_MODE=LOCAL_FORK_SIMULATION"
          forge test \
            --match-path test/P301_UnauthorizedRemovalProof.t.sol \
            --match-test test_UnauthorizedCannotRemoveSupportedAsset \
            -vvv

      - name: Record validation status
        if: always()
        shell: bash
        run: |
          echo "Execution mode: local fork simulation"
          echo "Live trading: prohibited"
          echo "Mainnet transactions: none"
