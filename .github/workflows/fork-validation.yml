name: Fork Validation Lab

on:
  push:
    branches:
      - main
    paths:
      - "test/**"
      - "src/**"
      - "foundry.toml"
      - ".github/workflows/fork-validation.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ethena-local-fork-validation:
    name: Ethena Local Fork Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check RPC secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ETHENA_FORK_RPC:-}" ]; then
            echo "::error::ETHENA_FORK_RPC repository secret is missing."
            exit 1
          fi
          echo "RPC secret is configured. Value is not printed."

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Prepare Foundry project
        shell: bash
        run: |
          set -euo pipefail
          forge --version
          if [ ! -f foundry.toml ]; then
            echo "::error::foundry.toml was not found."
            exit 1
          fi
          forge build

      - name: Verify diagnostic test files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "test/P301_UnauthorizedRemovalProof.t.sol"
            "test/EthenaAdminRoleDiagnostic.t.sol"
            "test/P30_2_MintWETHReadOnlyDiagnostic.t.sol"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required test file not found: $file"
              exit 1
            fi
            echo "Found: $file"
          done

      - name: Safety declaration
        shell: bash
        run: |
          echo "Mode: READ-ONLY FORK DIAGNOSTICS"
          echo "Live trading: DISABLED"
          echo "No private keys or signing secrets are configured by this workflow."
          echo "Diagnostic steps must not submit transactions."

      - name: Run P301 unauthorized access-control test
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --match-path test/P301_UnauthorizedRemovalProof.t.sol \
            --match-test test_UnauthorizedCannotRemoveSupportedAsset \
            -vvvv

      - name: Run read-only admin role diagnostic
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --match-path test/EthenaAdminRoleDiagnostic.t.sol \
            --match-test test_ReadOnlyAdminRoleDiagnostics \
            -vvvv

      - name: Run P30.2 read-only WETH diagnostic
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --match-path test/P30_2_MintWETHReadOnlyDiagnostic.t.sol \
            --match-test test_P302_ReadOnlyConfigurationDiagnostic \
            -vvvv

      - name: Run P30.1 diagnostics if present
        shell: bash
        run: |
          set -euo pipefail

          if [ -f test/P30_1_MintWETHAccountingInvariant.t.sol ]; then
            forge test \
              --match-path test/P30_1_MintWETHAccountingInvariant.t.sol \
              -vvvv
          else
            echo "P30.1 test file not found; skipping optional step."
          fi

      - name: Record validation status
        if: always()
        shell: bash
        run: |
          echo "Fork validation workflow finished."
          echo "Review each test result before drawing security conclusions."
          echo "A green workflow is not, by itself, proof of a vulnerability or proof of complete security."
