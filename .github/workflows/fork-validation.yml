name: Fork Validation Lab

on:
  push:
    branches:
      - main
    paths:
      - "test/**"
      - "src/**"
      - "lib/**"
      - "foundry.toml"
      - ".github/workflows/fork-validation.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ethena-local-fork-validation:
    name: Ethena Local Fork Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check RPC secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ETHENA_FORK_RPC:-}" ]; then
            echo "::error::ETHENA_FORK_RPC repository secret is missing."
            exit 1
          fi
          echo "RPC secret is configured. Value will not be printed."

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Prepare Foundry project
        shell: bash
        run: |
          set -euo pipefail

          forge --version

          if [ ! -f foundry.toml ]; then
            echo "foundry.toml not found; creating a minimal configuration."

            cat > foundry.toml <<'TOML'
          [profile.default]
          src = "src"
          test = "test"
          script = "script"
          out = "out"
          libs = ["lib"]
          solc_version = "0.8.26"
          auto_detect_solc = false
          optimizer = true
          optimizer_runs = 200

          [rpc_endpoints]
          mainnet = "${ETHENA_FORK_RPC}"
          TOML
          fi

          echo "Foundry configuration:"
          cat foundry.toml

          if [ ! -d lib/forge-std ]; then
            echo "forge-std not found; installing dependency."
            mkdir -p lib
            forge install foundry-rs/forge-std --no-git
          fi

          forge build

      - name: Verify diagnostic test files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "test/P301_UnauthorizedRemovalProof.t.sol"
            "test/EthenaAdminRoleDiagnostic.t.sol"
            "test/P30_2_MintWETHReadOnlyDiagnostic.t.sol"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required test file not found: $file"
              exit 1
            fi
            echo "Found: $file"
          done

      - name: Safety declaration
        shell: bash
        run: |
          echo "Mode: LOCAL FORK DIAGNOSTICS"
          echo "No private keys are configured by this workflow."
          echo "No live transaction submission is intended."
          echo "Fork tests must not be treated as authorization for live execution."

      - name: Run P301 unauthorized access-control test
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --match-path test/P301_UnauthorizedRemovalProof.t.sol \
            --match-test test_UnauthorizedCannotRemoveSupportedAsset \
            -vvvv

      - name: Run read-only admin role diagnostic
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --match-path test/EthenaAdminRoleDiagnostic.t.sol \
            --match-test test_ReadOnlyAdminRoleDiagnostics \
            -vvvv

      - name: Run P30.2 read-only WETH diagnostic
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --match-path test/P30_2_MintWETHReadOnlyDiagnostic.t.sol \
            --match-test test_P302_ReadOnlyConfigurationDiagnostic \
            -vvvv

      - name: Record validation status
        if: always()
        shell: bash
        run: |
          echo "Fork validation workflow finished."
          echo "Review every test result before drawing conclusions."
          echo "Passing tests do not independently prove a vulnerability."
