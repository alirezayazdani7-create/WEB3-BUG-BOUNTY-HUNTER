name: Fork Validation Lab

on:
  push:
    branches:
      - main
    paths:
      - "test/**"
      - "src/**"
      - "lib/**"
      - "foundry.toml"
      - ".github/workflows/fork-validation.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ethena-local-fork-validation:
    name: Ethena Local Fork Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}
      ETH_RPC_URL: ${{ secrets.ETHENA_FORK_RPC }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check RPC configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ETHENA_FORK_RPC:-}" ]; then
            echo "::error::ETHENA_FORK_RPC secret is missing."
            exit 1
          fi

          if [ -z "${ETH_RPC_URL:-}" ]; then
            echo "::error::ETH_RPC_URL alias is missing."
            exit 1
          fi

          echo "RPC environment variables are configured."

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Prepare Foundry configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > foundry.toml <<'TOML'
          [profile.default]
          src = "src"
          test = "test"
          script = "script"
          out = "out"
          libs = ["lib"]
          auto_detect_solc = true
          optimizer = true
          optimizer_runs = 200
          TOML

          if [ ! -d lib/forge-std/src ]; then
            mkdir -p lib
            forge install foundry-rs/forge-std --no-git
          fi

          forge --version

      - name: Verify diagnostic files
        shell: bash
        run: |
          set -euo pipefail

          test -f test/P301_UnauthorizedRemovalProof.t.sol
          test -f test/EthenaAdminRoleDiagnostic.t.sol
          test -f test/P30_2_MintWETHReadOnlyDiagnostic.t.sol

          echo "Required diagnostic files exist."

      - name: Run P301 access-control test
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --match-path test/P301_UnauthorizedRemovalProof.t.sol \
            -vvvv

      - name: Run admin role diagnostic
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --match-path test/EthenaAdminRoleDiagnostic.t.sol \
            -vvvv

      - name: Run P30.2 read-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          forge test \
            --match-path test/P30_2_MintWETHReadOnlyDiagnostic.t.sol \
            -vvvv

      - name: Safety declaration
        if: always()
        shell: bash
        run: |
          echo "Mode: local fork diagnostics only."
          echo "Live execution remains prohibited."
          echo "No live transaction is authorized."
          echo "Passing tests alone do not prove a vulnerability."
