- name: Configure local fork authorization
  shell: bash
  run: |
    set -euo pipefail

    RPC="http://127.0.0.1:8545"

    OWNER="$(
      cast call \
        "${MINTING}" \
        "owner()(address)" \
        --rpc-url "${RPC}"
    )"

    cast rpc \
      --rpc-url "${RPC}" \
      anvil_impersonateAccount \
      "${OWNER}"

    cast rpc \
      --rpc-url "${RPC}" \
      anvil_setBalance \
      "${OWNER}" \
      "0x3635C9ADC5DEA0000000"

    MINTER_ROLE="$(
      cast keccak "MINTER_ROLE"
    )"

    cast send \
      --unlocked \
      --from "${OWNER}" \
      "${MINTING}" \
      "grantRole(bytes32,address)" \
      "${MINTER_ROLE}" \
      "${LOCAL_TESTER}" \
      --rpc-url "${RPC}"

    cast send \
      --unlocked \
      --from "${OWNER}" \
      "${MINTING}" \
      "addWhitelistedBenefactor(address)" \
      "${LOCAL_TESTER}" \
      --rpc-url "${RPC}"

    HAS_ROLE="$(
      cast call \
        "${MINTING}" \
        "hasRole(bytes32,address)(bool)" \
        "${MINTER_ROLE}" \
        "${LOCAL_TESTER}" \
        --rpc-url "${RPC}"
    )"

    test "${HAS_ROLE}" = "true"

    WHITELISTED="$(
      cast call \
        "${MINTING}" \
        "isWhitelistedBenefactor(address)(bool)" \
        "${LOCAL_TESTER}" \
        --rpc-url "${RPC}"
    )"

    test "${WHITELISTED}" = "true"

    echo "LOCAL_AUTHORIZATION=PASS"
