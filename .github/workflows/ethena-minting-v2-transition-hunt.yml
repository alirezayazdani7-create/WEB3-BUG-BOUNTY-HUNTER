name: Ethena Minting V2 Transition Hunt

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minting-v2-transition-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EXECUTION_MODE: LOCAL_FORK_ONLY
      MAINNET_TRANSACTIONS: "NONE"
      LIVE_EXECUTION: PROHIBITED
      SUBMISSION: NOT_PERFORMED
      MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Start isolated Anvil fork
        shell: bash
        run: |
          set -euo pipefail

          echo "EXECUTION_MODE=${EXECUTION_MODE}"
          echo "MAINNET_TRANSACTIONS=${MAINNET_TRANSACTIONS}"
          echo "LIVE_EXECUTION=${LIVE_EXECUTION}"
          echo "SUBMISSION=${SUBMISSION}"
          echo "Using PublicNode Ethereum Mainnet RPC."

          anvil \
            --fork-url "${MAINNET_RPC_URL}" \
            --chain-id 31337 \
            --host 127.0.0.1 \
            --port 8545 \
            > /tmp/anvil.log 2>&1 &

          for i in $(seq 1 30); do
            if cast chain-id \
              --rpc-url http://127.0.0.1:8545 \
              >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          CHAIN_ID="$(cast chain-id --rpc-url http://127.0.0.1:8545)"

          test "${CHAIN_ID}" = "31337"

          echo "ANVIL_READY=PASS"
          echo "LOCAL_CHAIN_ID=${CHAIN_ID}"

      - name: Run Minting V2 tests
        shell: bash
        run: |
          set -euo pipefail

          echo "Running isolated Foundry tests..."
          echo "Fork RPC: http://127.0.0.1:8545"
          echo "Live execution: PROHIBITED"

          forge test \
            --fork-url http://127.0.0.1:8545 \
            --match-path test/MintingV2Transition.t.sol \
            -vvv

      - name: Final safety assertion
        shell: bash
        run: |
          set -euo pipefail

          test "${EXECUTION_MODE}" = "LOCAL_FORK_ONLY"
          test "${MAINNET_TRANSACTIONS}" = "NONE"
          test "${LIVE_EXECUTION}" = "PROHIBITED"
          test "${SUBMISSION}" = "NOT_PERFORMED"

          echo "SAFETY_STATUS=PASS"

      - name: Dump Anvil log on failure
        if: failure()
        shell: bash
        run: |
          echo "===== ANVIL LOG ====="
          cat /tmp/anvil.log || true
