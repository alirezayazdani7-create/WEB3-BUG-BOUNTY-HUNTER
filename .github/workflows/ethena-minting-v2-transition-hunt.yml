name: Ethena Minting V2 Transition Hunt

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minting-v2-transition-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EXECUTION_MODE: LOCAL_FORK_ONLY
      MAINNET_TRANSACTIONS: "NONE"
      LIVE_EXECUTION: PROHIBITED
      SUBMISSION: NOT_PERFORMED
      MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Start isolated Anvil fork
        shell: bash
        run: |
          set -euo pipefail

          echo "EXECUTION_MODE=${EXECUTION_MODE}"
          echo "MAINNET_TRANSACTIONS=${MAINNET_TRANSACTIONS}"
          echo "LIVE_EXECUTION=${LIVE_EXECUTION}"
          echo "SUBMISSION=${SUBMISSION}"
          echo "Using PublicNode Ethereum Mainnet RPC."

          anvil \
            --fork-url "${MAINNET_RPC_URL}" \
            --chain-id 31337 \
            --host 127.0.0.1 \
            --port 8545 \
            > /tmp/anvil.log 2>&1 &

          echo $! > /tmp/anvil.pid

          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          test "$(cast chain-id --rpc-url http://127.0.0.1:8545)" = "31337"

          echo "ANVIL_READY=PASS"

      - name: Run Minting V2 transition tests
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/ethena-minting-v2

          cat > /tmp/ethena-minting-v2/MintingV2Transition.t.sol <<'SOL'
          // SPDX-License-Identifier: UNLICENSED
          pragma solidity ^0.8.20;

          interface Vm {
              function createSelectFork(string calldata urlOrAlias) external returns (uint256);
              function createSelectFork(string calldata urlOrAlias, uint256 blockNumber) external returns (uint256);
              function addr(uint256 privateKey) external returns (address);
              function startPrank(address) external;
              function stopPrank() external;
              function deal(address who, uint256 newBalance) external;
              function warp(uint256 newTimestamp) external;
          }

          interface IERC20 {
              function balanceOf(address account) external view returns (uint256);
              function decimals() external view returns (uint8);
          }

          interface IEthenaMinting {
              function usde() external view returns (address);

              function verifyNonce(
                  address sender,
                  uint128 nonce
              ) external view returns (bool);

              function verifyRoute(
                  address[] calldata custodians,
                  uint256[] calldata ratios
              ) external view returns (bool);

              function verifyOrder(
                  address benefactor,
                  address beneficiary,
                  address collateralAsset,
                  uint256 collateralAmount,
                  uint256 usdeAmount,
                  uint256 nonce,
                  uint256 expiry,
                  bytes calldata signature
              ) external view returns (bool);
          }

          contract MintingV2TransitionTest {
              Vm constant vm =
                  Vm(address(uint160(uint256(keccak256("hevm cheat code")))));

              address constant MINTING =
                  0xe3490297a08d6fC8Da46Edb7B6142E4F461b62D3;

              address constant USDE =
                  0x4c9EDD5852cd905f086C759E8383e09bff1E68B3;

              IEthenaMinting target = IEthenaMinting(MINTING);

              function assertTrue(bool value, string memory reason) internal pure {
                  require(value, reason);
              }

              function assertEq(
                  address a,
                  address b,
                  string memory reason
              ) internal pure {
                  require(a == b, reason);
              }

              function test_P01_usde_binding() external view {
                  address configured = target.usde();

                  assertEq(
                      configured,
                      USDE,
                      "EthenaMinting V2 USDe binding mismatch"
                  );

                  emit log_string("P01_USDE_BINDING=PASS");
              }

              function test_P02_nonce_64bit_collision_property() external view {
                  address sender = address(0x1111);

                  uint128 nonceA = uint128(0x1234);
                  uint128 nonceB =
                      uint128(uint256(0x1234) + (uint256(1) << 64));

                  bool first = target.verifyNonce(sender, nonceA);
                  bool second = target.verifyNonce(sender, nonceB);

                  /*
                   * Both values share the same low 8 bits and the same
                   * uint64-derived bitmap slot because the implementation
                   * truncates nonce to uint64 for the slot calculation.
                   *
                   * This test only records the property.
                   * It does NOT claim exploitability.
                   */
                  assertTrue(
                      first == second,
                      "nonce collision property changed unexpectedly"
                  );

                  emit log_string("P02_NONCE_COLLISION_PROPERTY=OBSERVED");
              }

              function test_P03_invalid_non_custodian_route_rejected() external view {
                  address[] memory custodians = new address[](2);
                  uint256[] memory ratios = new uint256[](2);

                  custodians[0] = address(1);
                  custodians[1] = address(2);

                  ratios[0] = 5000;
                  ratios[1] = 5000;

                  bool valid = target.verifyRoute(custodians, ratios);

                  assertTrue(
                      !valid,
                      "non-custodian route unexpectedly accepted"
                  );

                  emit log_string(
                      "P03_NON_CUSTODIAN_ROUTE_REJECTED=PASS"
                  );
              }

              function test_P04_route_ratio_sum_under_10000_rejected() external view {
                  address[] memory custodians = new address[](2);
                  uint256[] memory ratios = new uint256[](2);

                  custodians[0] = address(1);
                  custodians[1] = address(2);

                  ratios[0] = 4999;
                  ratios[1] = 4999;

                  bool valid = target.verifyRoute(custodians, ratios);

                  assertTrue(
                      !valid,
                      "under-sum route unexpectedly accepted"
                  );

                  emit log_string(
                      "P04_ROUTE_UNDERSUM_REJECTED=PASS"
                  );
              }

              function test_P05_route_ratio_sum_over_10000_rejected() external view {
                  address[] memory custodians = new address[](2);
                  uint256[] memory ratios = new uint256[](2);

                  custodians[0] = address(1);
                  custodians[1] = address(2);

                  ratios[0] = 5001;
                  ratios[1] = 5000;

                  bool valid = target.verifyRoute(custodians, ratios);

                  assertTrue(
                      !valid,
                      "over-sum route unexpectedly accepted"
                  );

                  emit log_string(
                      "P05_ROUTE_OVERSUM_REJECTED=PASS"
                  );
              }

              function test_P06_empty_route_rejected() external view {
                  address[] memory custodians = new address[](0);
                  uint256[] memory ratios = new uint256[](0);

                  bool valid = target.verifyRoute(custodians, ratios);

                  assertTrue(
                      !valid,
                      "empty route unexpectedly accepted"
                  );

                  emit log_string(
                      "P06_EMPTY_ROUTE_REJECTED=PASS"
                  );
              }

              function test_P07_route_length_mismatch_rejected() external view {
                  address[] memory custodians = new address[](2);
                  uint256[] memory ratios = new uint256[](1);

                  custodians[0] = address(1);
                  custodians[1] = address(2);

                  ratios[0] = 10000;

                  bool valid = target.verifyRoute(custodians, ratios);

                  assertTrue(
                      !valid,
                      "length mismatch unexpectedly accepted"
                  );

                  emit log_string(
                      "P07_ROUTE_LENGTH_MISMATCH_REJECTED=PASS"
                  );
              }

              function test_P08_zero_ratio_rejected() external view {
                  address[] memory custodians = new address[](2);
                  uint256[] memory ratios = new uint256[](2);

                  custodians[0] = address(1);
                  custodians[1] = address(2);

                  ratios[0] = 10000;
                  ratios[1] = 0;

                  bool valid = target.verifyRoute(custodians, ratios);

                  assertTrue(
                      !valid,
                      "zero-ratio route unexpectedly accepted"
                  );

                  emit log_string(
                      "P08_ZERO_RATIO_REJECTED=PASS"
                  );
              }

              function test_P09_zero_nonce_property() external view {
                  address sender = address(0x2222);

                  bool valid = target.verifyNonce(sender, 0);

                  /*
                   * Observation only.
                   * A zero nonce being valid is not itself a vulnerability.
                   */
                  emit log_string(
                      valid
                          ? "P09_ZERO_NONCE=VALID_OBSERVATION"
                          : "P09_ZERO_NONCE=REJECTED"
                  );
              }

              function test_P10_large_nonce_property() external view {
                  address sender = address(0x3333);

                  uint128 nonce =
                      type(uint128).max;

                  bool valid = target.verifyNonce(sender, nonce);

                  /*
                   * Observation only.
                   * This test checks that the implementation handles the
                   * uint128 boundary without reverting unexpectedly.
                   */
                  emit log_string(
                      valid
                          ? "P10_MAX_UINT128_NONCE=VALID_OBSERVATION"
                          : "P10_MAX_UINT128_NONCE=REJECTED"
                  );
              }
          }
          SOL

          cat > /tmp/ethena-minting-v2/Foundry.toml <<'TOML'
          [profile.default]
          src = "src"
          test = "test"
          solc_version = "0.8.20"
          optimizer = true
          optimizer_runs = 200
          TOML

          mkdir -p /tmp/ethena-minting-v2/test

          mv /tmp/ethena-minting-v2/MintingV2Transition.t.sol \
             /tmp/ethena-minting-v2/test/MintingV2Transition.t.sol

          cd /tmp/ethena-minting-v2

          forge test \
            --fork-url http://127.0.0.1:8545 \
            -vvv

      - name: Final safety assertion
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PARSA / ETHENA SAFETY ASSERTIONS"
          echo "========================================"
          echo "EXECUTION_MODE=${EXECUTION_MODE}"
          echo "MAINNET_TRANSACTIONS=${MAINNET_TRANSACTIONS}"
          echo "LIVE_EXECUTION=${LIVE_EXECUTION}"
          echo "SUBMISSION=${SUBMISSION}"
          echo "========================================"

          test "${EXECUTION_MODE}" = "LOCAL_FORK_ONLY"
          test "${MAINNET_TRANSACTIONS}" = "NONE"
          test "${LIVE_EXECUTION}" = "PROHIBITED"
          test "${SUBMISSION}" = "NOT_PERFORMED"

          echo "SAFETY_STATUS=PASS"

      - name: Dump Anvil log on failure
        if: failure()
        shell: bash
        run: |
          echo "===== ANVIL LOG ====="
          cat /tmp/anvil.log || true
