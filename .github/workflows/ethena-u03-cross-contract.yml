name: Ethena U03 Cross Contract

on:
  workflow_dispatch:

jobs:
  u03:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Create isolated Foundry project
        run: |
          mkdir -p /tmp/u03/src /tmp/u03/test
          cp test/U03CrossContractInvariantProbe.t.sol /tmp/u03/test/
          cd /tmp/u03
          forge init --force --no-git .
          forge install foundry-rs/forge-std --no-commit

      - name: Run U03
        working-directory: /tmp/u03
        env:
          ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}
          U03_PSM: ${{ secrets.U03_PSM }}
          U03_USDTB: ${{ secrets.U03_USDTB }}
          U03_COLLATERAL: ${{ secrets.U03_COLLATERAL }}
          U03_SWAP_CALL: ${{ secrets.U03_SWAP_CALL }}
        run: |
          forge test \
            --match-contract U03CrossContractInvariantProbe \
            -vvv
