name: Ethena S06 Sequential Mint Cap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ethena-s06-sequential-cap
  cancel-in-progress: false

jobs:
  sequential-cap-test:
    name: Sequential Mint Cap Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MODE: LOCAL_FORK_ONLY
      LIVE_TRADING: PROHIBITED
      MAINNET_TRANSACTIONS: NONE
      FOUNDRY_PROFILE: default

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify safety mode
        shell: bash
        run: |
          set -euo pipefail
          test "$MODE" = "LOCAL_FORK_ONLY"
          test "$LIVE_TRADING" = "PROHIBITED"
          test "$MAINNET_TRANSACTIONS" = "NONE"
          echo "Safety mode verified."
          echo "No live transactions will be submitted."

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          test -f test/EthenaS06SequentialMintCap.t.sol
          echo "Required test file exists."

          if [ -f foundry.toml ]; then
            echo "Foundry config exists."
          else
            echo "No foundry.toml; Foundry defaults will be used."
          fi

      - name: Prepare forge-std
        shell: bash
        run: |
          set -euo pipefail

          if [ -d lib/forge-std ]; then
            echo "forge-std directory already exists."
          elif [ -f .gitmodules ] && grep -q "forge-std" .gitmodules; then
            git submodule update --init --depth 1 lib/forge-std
          else
            forge install foundry-rs/forge-std --no-git
          fi

          test -f lib/forge-std/src/Test.sol
          echo "forge-std is available."

      - name: Diagnose StdStorage assembly blocks
        shell: bash
        continue-on-error: true
        run: |
          set -u

          FILE="lib/forge-std/src/StdStorage.sol"

          if [ -f "$FILE" ]; then
            echo "Inspecting assembly blocks in $FILE"
            grep -n -B 3 -A 8 "assembly" "$FILE" || true
          else
            echo "StdStorage.sol not found; skipping diagnostic."
          fi

      - name: Run sequential cap test
        shell: bash
        env:
          ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}
        run: |
          set -euo pipefail

          if [ -z "${ETHENA_FORK_RPC:-}" ]; then
            echo "::error::ETHENA_FORK_RPC repository secret is missing."
            exit 1
          fi

          forge test \
            --match-path test/EthenaS06SequentialMintCap.t.sol \
            --match-test test_SequentialMintCountersAndOverCapRejection \
            -vvv

      - name: Safety summary
        if: always()
        shell: bash
        run: |
          echo "MODE=LOCAL_FORK_ONLY"
          echo "LIVE_TRADING=PROHIBITED"
          echo "MAINNET_TRANSACTIONS=NONE"
          echo "This workflow is for local fork testing only."
          echo "No live transaction submission is authorized."
