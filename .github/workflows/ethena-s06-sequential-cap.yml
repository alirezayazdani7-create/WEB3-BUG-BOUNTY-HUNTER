
name: Ethena S06 Sequential Mint Cap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ethena-s06-sequential-cap
  cancel-in-progress: false

jobs:
  sequential-cap-test:
    name: Sequential Mint Cap Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MODE: LOCAL_FORK_ONLY
      LIVE_TRADING: PROHIBITED
      MAINNET_TRANSACTIONS: NONE
      FOUNDRY_PROFILE: default

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify safety mode
        shell: bash
        run: |
          set -euo pipefail
          test "$MODE" = "LOCAL_FORK_ONLY"
          test "$LIVE_TRADING" = "PROHIBITED"
          test "$MAINNET_TRANSACTIONS" = "NONE"
          echo "Safety mode verified."

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Verify required test
        shell: bash
        run: |
          set -euo pipefail
          test -f test/EthenaS06SequentialMintCap.t.sol
          echo "S06 test exists."

      - name: Prepare forge-std
        shell: bash
        run: |
          set -euo pipefail

          if [ -f lib/forge-std/src/Test.sol ]; then
            echo "Using existing forge-std."
          elif [ -f .gitmodules ] && grep -q "forge-std" .gitmodules; then
            git submodule update --init --depth 1 lib/forge-std
          else
            forge install foundry-rs/forge-std --no-git
          fi

          test -f lib/forge-std/src/Test.sol
          test -f lib/forge-std/src/StdStorage.sol

      - name: Apply targeted Yul compatibility fix
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/forge-std/src/StdStorage.sol")
          source = path.read_text()

          old = """assembly {
                      mask := shl(offsetRight, sub(shl(sub(256, add(offsetRight, offsetLeft)), 1), 1))
                  }"""

          new = """assembly ("memory-safe") {
                      mask := shl(offsetRight, sub(shl(sub(256, add(offsetRight, offsetLeft)), 1), 1))
                  }"""

          if new in source:
              print("StdStorage compatibility fix already present.")
          elif old in source:
              path.write_text(source.replace(old, new, 1))
              print("Patched the specific StdStorage assembly block.")
          else:
              raise SystemExit(
                  "Expected StdStorage assembly block not found; "
                  "stopping rather than applying an unverified patch."
              )
          PY

          grep -F 'assembly ("memory-safe")' \
            lib/forge-std/src/StdStorage.sol

      - name: Create isolated S06 project
        shell: bash
        run: |
          set -euo pipefail

          ISOLATED="$RUNNER_TEMP/s06-isolated"
          mkdir -p "$ISOLATED/test" "$ISOLATED/lib"

          cp test/EthenaS06SequentialMintCap.t.sol \
            "$ISOLATED/test/EthenaS06SequentialMintCap.t.sol"

          ln -s "$GITHUB_WORKSPACE/lib/forge-std" \
            "$ISOLATED/lib/forge-std"

          # The test's assembly only reads the bytes buffer's first word.
          sed -i 's/assembly {/assembly ("memory-safe") {/g' \
            "$ISOLATED/test/EthenaS06SequentialMintCap.t.sol"

          cat > "$ISOLATED/foundry.toml" <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          libs = ["lib"]
          solc_version = "0.8.20"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          EOF

          echo "Isolated test project prepared."

      - name: Run sequential mint cap test
        shell: bash
        env:
          ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}
        run: |
          set -euo pipefail

          if [ -z "${ETHENA_FORK_RPC:-}" ]; then
            echo "::error::ETHENA_FORK_RPC secret is missing."
            exit 1
          fi

          cd "$RUNNER_TEMP/s06-isolated"

          forge test \
            --use 0.8.20 \
            --match-path test/EthenaS06SequentialMintCap.t.sol \
            --match-test test_SequentialMintCountersAndOverCapRejection \
            -vvv

      - name: Safety summary
        if: always()
        shell: bash
        run: |
          echo "MODE=LOCAL_FORK_ONLY"
          echo "LIVE_TRADING=PROHIBITED"
          echo "MAINNET_TRANSACTIONS=NONE"
          echo "No live transactions submitted."
