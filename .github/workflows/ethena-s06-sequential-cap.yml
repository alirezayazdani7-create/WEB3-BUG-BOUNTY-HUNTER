name: Ethena S06 Sequential Mint Cap Test

'on':
  workflow_dispatch:
  push:
    branches:
      - test/cumulative-cap-real-mint-flow
    paths:
      - 'foundry.toml'
      - 'test/EthenaS06SequentialMintCap.t.sol'
      - '.github/workflows/ethena-s06-sequential-cap.yml'

permissions:
  contents: read

concurrency:
  group: ethena-s06-sequential-cap
  cancel-in-progress: false

jobs:
  sequential-cap-test:
    name: Sequential mint cap test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ETHENA_FORK_RPC: "${{ secrets.ETHENA_FORK_RPC }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify RPC secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ETHENA_FORK_RPC:-}" ]; then
            echo "::error::ETHENA_FORK_RPC secret is missing"
            exit 1
          fi
          echo "RPC secret is configured."

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          test -f foundry.toml
          test -f test/EthenaS06SequentialMintCap.t.sol
          grep -q 'test_SequentialMintCountersAndOverCapRejection' test/EthenaS06SequentialMintCap.t.sol
          forge --version

      - name: Prepare Foundry dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f lib/forge-std/src/Test.sol ]; then
            forge install foundry-rs/forge-std --no-commit
          fi
          test -f lib/forge-std/src/StdStorage.sol
          test -f lib/forge-std/src/Test.sol

      - name: Patch targeted memory-safe assembly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("lib/forge-std/src/StdStorage.sol")
          source = path.read_text()

          target = r"mask\s*:=\s*shl\s*\(\s*offsetRight"

          safe_pattern = re.compile(
              r'assembly\s*\(\s*"memory-safe"\s*\)\s*\{'
              r'(?=[^}]*' + target + r')'
          )

          unsafe_pattern = re.compile(
              r'assembly\s*\{'
              r'(?=[^}]*' + target + r')'
          )

          safe_matches = list(safe_pattern.finditer(source))
          unsafe_matches = list(unsafe_pattern.finditer(source))

          if len(safe_matches) == 1 and len(unsafe_matches) == 0:
              print("Target assembly is already memory-safe.")
          elif len(unsafe_matches) == 1 and len(safe_matches) == 0:
              source = unsafe_pattern.sub(
                  'assembly ("memory-safe") {',
                  source,
                  count=1
              )
              path.write_text(source)
              print("Target assembly patched successfully.")
          else:
              raise SystemExit(
                  "Expected exactly one target assembly block; "
                  "refusing an ambiguous or unsafe patch."
              )

          check = path.read_text()
          if not safe_pattern.search(check):
              raise SystemExit("Memory-safe patch verification failed.")
          PY

      - name: Run sequential cap test
        shell: bash
        run: |
          set -euo pipefail
          echo "MODE=LOCAL_FORK_ONLY"
          echo "LIVE_TRADING=PROHIBITED"
          echo "MAINNET_TRANSACTIONS=NONE"
          forge test \
            --match-path test/EthenaS06SequentialMintCap.t.sol \
            --match-test test_SequentialMintCountersAndOverCapRejection \
            -vvv

      - name: Report execution restrictions
        if: always()
        shell: bash
        run: |
          echo "Execution mode: local fork simulation only"
          echo "Live trading: prohibited"
          echo "Mainnet transactions: none"
