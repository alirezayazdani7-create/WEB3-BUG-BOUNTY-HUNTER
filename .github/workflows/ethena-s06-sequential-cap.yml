name: Ethena S06 Sequential Mint Cap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ethena-s06-sequential-cap
  cancel-in-progress: false

jobs:
  sequential-cap-test:
    name: Sequential Mint Cap Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FOUNDRY_PROFILE: default
      MODE: LOCAL_FORK_ONLY
      LIVE_TRADING: PROHIBITED
      MAINNET_TRANSACTIONS: NONE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify safety mode
        shell: bash
        run: |
          set -euo pipefail
          test "$MODE" = "LOCAL_FORK_ONLY"
          test "$LIVE_TRADING" = "PROHIBITED"
          test "$MAINNET_TRANSACTIONS" = "NONE"
          echo "Safety checks passed."

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          test -f foundry.toml
          test -f test/EthenaS06SequentialMintCap.t.sol

      - name: Prepare forge-std
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f lib/forge-std/src/Test.sol ]; then
            mkdir -p lib
            git clone --depth 1 https://github.com/foundry-rs/forge-std.git lib/forge-std
          fi
          test -f lib/forge-std/src/Test.sol
          test -f lib/forge-std/src/StdStorage.sol

      - name: Diagnose StdStorage assembly blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("lib/forge-std/src/StdStorage.sol")
          source = path.read_text()
          lines = source.splitlines()

          matches = list(re.finditer(
              r'assembly(?:\s*\(\s*"memory-safe"\s*\))?\s*\{',
              source
          ))

          print(f"File: {path}")
          print(f"Assembly blocks: {len(matches)}")

          for match in matches:
              line_no = source.count("\n", 0, match.start()) + 1
              print(f"\n--- Assembly block at line {line_no} ---")
              for i in range(max(0, line_no - 3), min(len(lines), line_no + 12)):
                  print(f"{i + 1}: {lines[i]}")
          PY

      - name: Run sequential cap test
        shell: bash
        env:
          ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}
        run: |
          set -euo pipefail
          if [ -z "${ETHENA_FORK_RPC:-}" ]; then
            echo "::error::ETHENA_FORK_RPC secret is missing."
            exit 1
          fi
          forge test --match-path test/EthenaS06SequentialMintCap.t.sol --match-test test_SequentialMintCountersAndOverCapRejection -vvv

      - name: Safety summary
        if: always()
        shell: bash
        run: |
          echo "MODE=LOCAL_FORK_ONLY"
          echo "LIVE_TRADING=PROHIBITED"
          echo "MAINNET_TRANSACTIONS=NONE"
          echo "No live transaction was submitted by this workflow."
