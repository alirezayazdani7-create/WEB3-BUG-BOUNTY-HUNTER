name: Ethena S06 Sequential Mint Cap

on:
workflow_dispatch:

permissions:
contents: read

concurrency:
group: ethena-s06-sequential-cap-${{ github.ref }}
cancel-in-progress: false

jobs:
sequential-cap-test:
name: Local Fork Sequential Mint Cap Test
runs-on: ubuntu-latest
timeout-minutes: 20

env:
  FOUNDRY_PROFILE: default
  LIVE_TRADING: "PROHIBITED"
  MAINNET_TRANSACTIONS: "NONE"
  MODE: "LOCAL_FORK_ONLY"

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      submodules: recursive
      fetch-depth: 1

  - name: Verify safety mode
    shell: bash
    run: |
      set -euo pipefail
      echo "MODE=${MODE}"
      echo "LIVE_TRADING=${LIVE_TRADING}"
      echo "MAINNET_TRANSACTIONS=${MAINNET_TRANSACTIONS}"
      test "${MODE}" = "LOCAL_FORK_ONLY"
      test "${LIVE_TRADING}" = "PROHIBITED"
      test "${MAINNET_TRANSACTIONS}" = "NONE"

  - name: Install Foundry
    uses: foundry-rs/foundry-toolchain@v1
    with:
      version: stable

  - name: Verify project files
    shell: bash
    run: |
      set -euo pipefail
      test -f foundry.toml
      test -f test/EthenaS06SequentialMintCap.t.sol
      forge --version
      git submodule status || true

  - name: Prepare forge-std dependency
    shell: bash
    run: |
      set -euo pipefail
      if [ ! -f lib/forge-std/src/Test.sol ]; then
        mkdir -p lib
        git clone --depth 1 https://github.com/foundry-rs/forge-std.git lib/forge-std
      fi
      test -f lib/forge-std/src/Test.sol
      test -f lib/forge-std/src/StdStorage.sol

  - name: Diagnose StdStorage assembly blocks
    shell: bash
    run: |
      set -euo pipefail
      python3 - <<'PY'
      from pathlib import Path
      import re

      path = Path("lib/forge-std/src/StdStorage.sol")
      source = path.read_text()

      blocks = list(re.finditer(
          r'assembly(?:\s*\(\s*"memory-safe"\s*\))?\s*\{',
          source
      ))

      safe = [
          match for match in blocks
          if re.match(
              r'assembly\s*\(\s*"memory-safe"\s*\)\s*\{',
              match.group(0)
          )
      ]

      unsafe = [
          match for match in blocks
          if re.match(r'assembly\s*\{', match.group(0))
      ]

      print(f"File: {path}")
      print(f"Assembly blocks: {len(blocks)}")
      print(f"Memory-safe blocks: {len(safe)}")
      print(f"Unannotated blocks: {len(unsafe)}")

      lines = source.splitlines()
      for match in blocks:
          line_no = source.count("\n", 0, match.start()) + 1
          print(f"\n--- Assembly at line {line_no} ---")
          start = max(0, line_no - 3)
          end = min(len(lines), line_no + 14)
          for index in range(start, end):
              print(f"{index + 1}: {lines[index]}")
      PY

  - name: Run targeted sequential cap test
    shell: bash
    env:
      ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}
    run: |
      set -euo pipefail
      if [ -z "${ETHENA_FORK_RPC:-}" ]; then
        echo "::error::ETHENA_FORK_RPC repository secret is missing."
        exit 1
      fi
      forge test \
        --match-path test/EthenaS06SequentialMintCap.t.sol \
        --match-test test_SequentialMintCountersAndOverCapRejection \
        -vvv

  - name: Final safety summary
    if: always()
    shell: bash
    run: |
      echo "MODE=LOCAL_FORK_ONLY"
      echo "LIVE_TRADING=PROHIBITED"
      echo "MAINNET_TRANSACTIONS=NONE"
      echo "This workflow does not submit live transactions."
