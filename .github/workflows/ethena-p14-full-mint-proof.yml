name: Ethena P14 - Full Mint Proof - Local Fork Only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ethena-p14-full-mint-proof
  cancel-in-progress: false

jobs:
  p14-validation:
    name: Isolated Foundry P14 and P16 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      LIVE_TRADING: "false"
      MAINNET_TRANSACTIONS: "NONE"
      EXECUTION_MODE: "LOCAL_FORK_ONLY"
      AUTHORIZATION: "NOT_AUTHORIZED"
      ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify safety settings
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_TRADING" = "false"
          test "$MAINNET_TRANSACTIONS" = "NONE"
          test "$EXECUTION_MODE" = "LOCAL_FORK_ONLY"
          test "$AUTHORIZATION" = "NOT_AUTHORIZED"
          echo "SAFETY_CHECK=PASS"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify existing test sources
        shell: bash
        run: |
          set -euo pipefail
          test -s test/MintingV2P14FullPath.t.sol
          test -s test/MintingV2P16SignatureBinding.t.sol
          echo "P14_TEST_SOURCE=FOUND"
          echo "P16_SIGNATURE_TEST_SOURCE=FOUND"

      - name: Validate RPC configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ETH_RPC_URL:-}" ]; then
            echo "::error::ETH_RPC_URL secret is missing."
            exit 1
          fi
          echo "RPC_CONFIGURATION=AVAILABLE"

      - name: Start isolated local Anvil fork
        shell: bash
        run: |
          set -euo pipefail

          anvil \
            --fork-url "$ETH_RPC_URL" \
            --chain-id 31337 \
            --host 127.0.0.1 \
            --port 8545 \
            > /tmp/anvil-p14.log 2>&1 &

          echo "$!" > /tmp/anvil-p14.pid

          READY=0
          for i in $(seq 1 45); do
            if cast chain-id \
              --rpc-url http://127.0.0.1:8545 \
              >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/anvil-p14.log
            exit 1
          fi

          CHAIN_ID="$(cast chain-id \
            --rpc-url http://127.0.0.1:8545)"

          test "$CHAIN_ID" = "31337"
          echo "LOCAL_ANVIL=READY"

      - name: Create isolated Foundry workspace
        shell: bash
        run: |
          set -euo pipefail

          LAB_DIR="$RUNNER_TEMP/ethena-p14-lab"
          mkdir -p "$LAB_DIR/test" "$LAB_DIR/src"

          cp test/MintingV2P14FullPath.t.sol \
            "$LAB_DIR/test/"

          cp test/MintingV2P16SignatureBinding.t.sol \
            "$LAB_DIR/test/"

          cat > "$LAB_DIR/foundry.toml" <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          out = "out"
          libs = []
          solc_version = "0.8.26"
          auto_detect_solc = false
          EOF

          echo "$LAB_DIR" > \
            "$RUNNER_TEMP/ethena-p14-lab-path"

          echo "ISOLATED_WORKSPACE=READY"

      - name: Compile isolated test sources
        shell: bash
        run: |
          set -euo pipefail

          LAB_DIR="$(cat \
            "$RUNNER_TEMP/ethena-p14-lab-path")"

          cd "$LAB_DIR"
          forge build --force

      - name: Run P14 full-path tests
        shell: bash
        run: |
          set -euo pipefail

          LAB_DIR="$(cat \
            "$RUNNER_TEMP/ethena-p14-lab-path")"

          cd "$LAB_DIR"

          forge test \
            --fork-url http://127.0.0.1:8545 \
            --match-path test/MintingV2P14FullPath.t.sol \
            -vvvv

      - name: Run P16 signature-binding tests
        shell: bash
        run: |
          set -euo pipefail

          LAB_DIR="$(cat \
            "$RUNNER_TEMP/ethena-p14-lab-path")"

          cd "$LAB_DIR"

          forge test \
            --fork-url http://127.0.0.1:8545 \
            --match-path test/MintingV2P16SignatureBinding.t.sol \
            -vvvv

      - name: Record validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Ethena P14 Validation"
            echo ""
            echo "- Mode: Local Anvil fork"
            echo "- Mainnet transactions: NONE"
            echo "- Live execution: PROHIBITED"
            echo "- Authorization: NOT_AUTHORIZED"
            echo "- Review preceding steps for actual test results."
            echo "- Passing tests do not establish exploitability."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop local Anvil
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/anvil-p14.pid ]; then
            kill "$(cat /tmp/anvil-p14.pid)" \
              2>/dev/null || true
          fi
          echo "LOCAL_ANVIL_STOPPED"
