name: Ethena U02 PSM State

on:
  workflow_dispatch:

jobs:
  u02:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Create isolated Foundry project
        run: |
          rm -rf /tmp/u02
          mkdir -p /tmp/u02
          cd /tmp/u02

          forge init --force .

          rm -rf test
          mkdir -p test

          cp "$GITHUB_WORKSPACE/test/U02PSMStateTransitionProbe.t.sol" test/

          forge install foundry-rs/forge-std --no-commit

      - name: Run U02
        working-directory: /tmp/u02
        env:
          ETHENA_FORK_RPC: ${{ secrets.ETHENA_FORK_RPC }}
        run: |
          forge test \
            --match-contract U02PSMStateTransitionProbe \
            -vvv
