name: P31.1 — Adversarial Multi-Stage Local-Fork Attack Path

on:
  push:
    paths:
      - ".github/workflows/p31-adversarial-multistage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p31:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Clone authoritative audit harness
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/chrispyspearbit/ethena-audit-package.git \
            /tmp/ethena-audit

          test -f \
            /tmp/ethena-audit/package/source/bbp-public-assets/contracts/foundry.toml

          echo "AUTHORITATIVE_HARNESS=PASS"

      - name: Build P31.1 local-fork test
        run: |
          set -euo pipefail

          mkdir -p \
            /tmp/ethena-audit/package/source/bbp-public-assets/contracts/test/foundry/minting/tests

          cat > \
          /tmp/ethena-audit/package/source/bbp-public-assets/contracts/test/foundry/minting/tests/P31_AdversarialMultiStage.t.sol \
          <<'SOL'

          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.20;

          import {Test} from "forge-std/Test.sol";

          interface IEthenaMintingP31 {

              enum OrderType {
                  MINT,
                  REDEEM
              }

              enum SignatureType {
                  EIP712,
                  EIP1271
              }

              struct Order {
                  string order_id;
                  OrderType order_type;
                  uint120 expiry;
                  uint128 nonce;
                  address benefactor;
                  address beneficiary;
                  address collateral_asset;
                  uint128 collateral_amount;
                  uint128 usde_amount;
              }

              struct Route {
                  address[] addresses;
                  uint128[] ratios;
              }

              struct Signature {
                  SignatureType signature_type;
                  bytes signature_bytes;
              }

              function mint(
                  Order calldata order,
                  Route calldata route,
                  Signature calldata signature
              ) external;

              function redeem(
                  Order calldata order,
                  Signature calldata signature
              ) external;

              function setDelegatedSigner(
                  address delegateTo
              ) external;

              function confirmDelegatedSigner(
                  address delegatedBy
              ) external;

              function removeDelegatedSigner(
                  address removedSigner
              ) external;

              function setApprovedBeneficiary(
                  address beneficiary,
                  bool status
              ) external;

              function isApprovedBeneficiary(
                  address benefactor,
                  address beneficiary
              ) external view returns (bool);

              function isWhitelistedBenefactor(
                  address benefactor
              ) external view returns (bool);
          }

          contract P31_AdversarialMultiStage is Test {

              address constant MINTING =
                  0xe3490297a08d6fC8Da46Edb7B6142E4F461b62D3;

              address constant USDE =
                  0x4c9EDD5852cd905f086C759E8383e09bff1E68B3;

              address constant ATTACKER =
                  address(0xA11CE);

              address constant VICTIM =
                  address(0xB0B);

              function setUp() public {
                  vm.createSelectFork(
                      vm.envString("ETH_RPC_URL")
                  );
              }

              /*
               * STAGE 1
               *
               * Cross-account authorization isolation.
               *
               * An attacker must not be able to modify
               * authorization state belonging to VICTIM.
               */
              function testStage1_CrossAccountAuthorizationIsolation()
                  public
              {
                  IEthenaMintingP31 minting =
                      IEthenaMintingP31(MINTING);

                  bool beforeApproved =
                      minting.isApprovedBeneficiary(
                          VICTIM,
                          ATTACKER
                      );

                  bool beforeWhitelist =
                      minting.isWhitelistedBenefactor(
                          VICTIM
                      );

                  vm.startPrank(ATTACKER);

                  try minting.setDelegatedSigner(
                      VICTIM
                  ) {} catch {}

                  try minting.confirmDelegatedSigner(
                      VICTIM
                  ) {} catch {}

                  try minting.removeDelegatedSigner(
                      VICTIM
                  ) {} catch {}

                  try minting.setApprovedBeneficiary(
                      VICTIM,
                      true
                  ) {} catch {}

                  vm.stopPrank();

                  assertEq(
                      minting.isApprovedBeneficiary(
                          VICTIM,
                          ATTACKER
                      ),
                      beforeApproved
                  );

                  assertEq(
                      minting.isWhitelistedBenefactor(
                          VICTIM
                      ),
                      beforeWhitelist
                  );
              }

              /*
               * STAGE 2
               *
               * Unprivileged mint/redeem reachability.
               *
               * No balance manipulation and no deal().
               * The objective is only to establish that an
               * attacker cannot cross the execution boundary.
               */
              function testStage2_UnprivilegedCannotReachMintRedeem()
                  public
              {
                  IEthenaMintingP31 minting =
                      IEthenaMintingP31(MINTING);

                  IEthenaMintingP31.Order memory mintOrder =
                      IEthenaMintingP31.Order({
                          order_id: "P31.1-MINT",
                          order_type:
                              IEthenaMintingP31.OrderType.MINT,
                          expiry:
                              uint120(
                                  block.timestamp + 1 days
                              ),
                          nonce: 101,
                          benefactor: ATTACKER,
                          beneficiary: ATTACKER,
                          collateral_asset: USDE,
                          collateral_amount: 1e18,
                          usde_amount: 1e18
                      });

                  IEthenaMintingP31.Route memory route;

                  route.addresses =
                      new address[](1);

                  route.ratios =
                      new uint128[](1);

                  route.addresses[0] =
                      ATTACKER;

                  route.ratios[0] =
                      10000;

                  IEthenaMintingP31.Signature memory sig;

                  sig.signature_type =
                      IEthenaMintingP31.SignatureType.EIP712;

                  sig.signature_bytes =
                      new bytes(65);

                  vm.startPrank(ATTACKER);

                  try minting.mint(
                      mintOrder,
                      route,
                      sig
                  ) {
                      fail(
                          "UNPRIVILEGED_MINT_DID_NOT_REVERT"
                      );
                  } catch {}

                  IEthenaMintingP31.Order memory redeemOrder =
                      IEthenaMintingP31.Order({
                          order_id: "P31.1-REDEEM",
                          order_type:
                              IEthenaMintingP31.OrderType.REDEEM,
                          expiry:
                              uint120(
                                  block.timestamp + 1 days
                              ),
                          nonce: 102,
                          benefactor: ATTACKER,
                          beneficiary: ATTACKER,
                          collateral_asset: USDE,
                          collateral_amount: 1e18,
                          usde_amount: 1e18
                      });

                  try minting.redeem(
                      redeemOrder,
                      sig
                  ) {
                      fail(
                          "UNPRIVILEGED_REDEEM_DID_NOT_REVERT"
                      );
                  } catch {}

                  vm.stopPrank();
              }

              /*
               * STAGE 3
               *
               * Repeated authorization transitions.
               *
               * No token balance access. The only invariant
               * checked is that VICTIM's authorization state
               * remains isolated from ATTACKER.
               */
              function testStage3_RepeatedAuthorizationTransitions()
                  public
              {
                  IEthenaMintingP31 minting =
                      IEthenaMintingP31(MINTING);

                  bool initialApproved =
                      minting.isApprovedBeneficiary(
                          VICTIM,
                          ATTACKER
                      );

                  bool initialWhitelist =
                      minting.isWhitelistedBenefactor(
                          VICTIM
                      );

                  for (
                      uint256 i = 0;
                      i < 64;
                      ++i
                  ) {
                      vm.startPrank(ATTACKER);

                      if (i % 4 == 0) {
                          try minting.setDelegatedSigner(
                              VICTIM
                          ) {} catch {}
                      }

                      if (i % 4 == 1) {
                          try minting.confirmDelegatedSigner(
                              VICTIM
                          ) {} catch {}
                      }

                      if (i % 4 == 2) {
                          try minting.removeDelegatedSigner(
                              VICTIM
                          ) {} catch {}
                      }

                      if (i % 4 == 3) {
                          try minting.setApprovedBeneficiary(
                              VICTIM,
                              true
                          ) {} catch {}
                      }

                      vm.stopPrank();
                  }

                  assertEq(
                      minting.isApprovedBeneficiary(
                          VICTIM,
                          ATTACKER
                      ),
                      initialApproved
                  );

                  assertEq(
                      minting.isWhitelistedBenefactor(
                          VICTIM
                      ),
                      initialWhitelist
                  );
              }

              /*
               * STAGE 4
               *
               * Authorization reset / replay boundary.
               *
               * A repeated delegated-signer transition must not
               * accidentally grant ATTACKER authority over VICTIM.
               */
              function testStage4_DelegationReplayBoundary()
                  public
              {
                  IEthenaMintingP31 minting =
                      IEthenaMintingP31(MINTING);

                  bool beforeState =
                      minting.isApprovedBeneficiary(
                          VICTIM,
                          ATTACKER
                      );

                  vm.startPrank(ATTACKER);

                  try minting.setDelegatedSigner(
                      VICTIM
                  ) {} catch {}

                  try minting.confirmDelegatedSigner(
                      VICTIM
                  ) {} catch {}

                  try minting.removeDelegatedSigner(
                      VICTIM
                  ) {} catch {}

                  try minting.confirmDelegatedSigner(
                      VICTIM
                  ) {} catch {}

                  try minting.setApprovedBeneficiary(
                      VICTIM,
                      true
                  ) {} catch {}

                  try minting.setApprovedBeneficiary(
                      VICTIM,
                      false
                  ) {} catch {}

                  vm.stopPrank();

                  assertEq(
                      minting.isApprovedBeneficiary(
                          VICTIM,
                          ATTACKER
                      ),
                      beforeState
                  );
              }

              /*
               * STAGE 5
               *
               * Combined adversarial sequence.
               *
               * No artificial balances are introduced.
               * The invariant is authorization isolation.
               */
              function testStage5_CombinedSequencePreservesAuthorization()
                  public
              {
                  IEthenaMintingP31 minting =
                      IEthenaMintingP31(MINTING);

                  bool beforeApproved =
                      minting.isApprovedBeneficiary(
                          VICTIM,
                          ATTACKER
                      );

                  bool beforeWhitelist =
                      minting.isWhitelistedBenefactor(
                          VICTIM
                      );

                  for (
                      uint256 i = 0;
                      i < 128;
                      ++i
                  ) {
                      vm.startPrank(ATTACKER);

                      if (i % 6 == 0) {
                          try minting.setDelegatedSigner(
                              VICTIM
                          ) {} catch {}
                      }

                      if (i % 6 == 1) {
                          try minting.confirmDelegatedSigner(
                              VICTIM
                          ) {} catch {}
                      }

                      if (i % 6 == 2) {
                          try minting.removeDelegatedSigner(
                              VICTIM
                          ) {} catch {}
                      }

                      if (i % 6 == 3) {
                          try minting.setApprovedBeneficiary(
                              VICTIM,
                              true
                          ) {} catch {}
                      }

                      if (i % 6 == 4) {
                          try minting.setApprovedBeneficiary(
                              VICTIM,
                              false
                          ) {} catch {}
                      }

                      if (i % 6 == 5) {
                          try minting.confirmDelegatedSigner(
                              VICTIM
                          ) {} catch {}
                      }

                      vm.stopPrank();
                  }

                  assertEq(
                      minting.isApprovedBeneficiary(
                          VICTIM,
                          ATTACKER
                      ),
                      beforeApproved
                  );

                  assertEq(
                      minting.isWhitelistedBenefactor(
                          VICTIM
                      ),
                      beforeWhitelist
                  );
              }
          }
          SOL

      - name: Execute P31.1 on isolated mainnet fork
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          set -euo pipefail

          test -n "$ETH_RPC_URL"

          cd /tmp/ethena-audit/package/source/bbp-public-assets/contracts

          forge build

          forge test \
            --match-path \
            test/foundry/minting/tests/P31_AdversarialMultiStage.t.sol \
            -vvv

          echo "P31_1_LOCAL_FORK_EXECUTION=PASS"

      - name: Emit submission gate
        if: always()
        run: |
          echo "EXECUTION_MODE=LOCAL_FORK_ONLY"
          echo "MAINNET_TRANSACTIONS=NONE"
          echo "LIVE_EXECUTION=PROHIBITED"
          echo "SUBMISSION=NOT_PERFORMED"
