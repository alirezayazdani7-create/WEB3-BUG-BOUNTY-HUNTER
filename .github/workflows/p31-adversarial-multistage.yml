name: P31 — Adversarial Multi-Stage Local-Fork Attack Path

on:
  push:
    paths:
      - ".github/workflows/p31-adversarial-multistage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p31:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Clone authoritative audit harness
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/chrispyspearbit/ethena-audit-package.git \
            /tmp/ethena-audit

          test -f \
            /tmp/ethena-audit/package/source/bbp-public-assets/contracts/foundry.toml

          echo "AUTHORITATIVE_HARNESS=PASS"

      - name: Build adversarial local-fork test
        run: |
          set -euo pipefail

          mkdir -p \
            /tmp/ethena-audit/package/source/bbp-public-assets/contracts/test/foundry/minting/tests

          cat > \
          /tmp/ethena-audit/package/source/bbp-public-assets/contracts/test/foundry/minting/tests/P31_AdversarialMultiStage.t.sol \
          <<'SOL'

          // SPDX-License-Identifier: MIT
          pragma solidity 0.8.20;

          import {Test} from "forge-std/Test.sol";

          interface IEthenaMintingP31 {

              enum OrderType {
                  MINT,
                  REDEEM
              }

              enum SignatureType {
                  EIP712,
                  EIP1271
              }

              struct Order {
                  string order_id;
                  OrderType order_type;
                  uint120 expiry;
                  uint128 nonce;
                  address benefactor;
                  address beneficiary;
                  address collateral_asset;
                  uint128 collateral_amount;
                  uint128 usde_amount;
              }

              struct Route {
                  address[] addresses;
                  uint128[] ratios;
              }

              struct Signature {
                  SignatureType signature_type;
                  bytes signature_bytes;
              }

              function mint(
                  Order calldata order,
                  Route calldata route,
                  Signature calldata signature
              ) external;

              function redeem(
                  Order calldata order,
                  Signature calldata signature
              ) external;

              function setDelegatedSigner(
                  address delegateTo
              ) external;

              function confirmDelegatedSigner(
                  address delegatedBy
              ) external;

              function removeDelegatedSigner(
                  address removedSigner
              ) external;

              function setApprovedBeneficiary(
                  address beneficiary,
                  bool status
              ) external;

              function isApprovedBeneficiary(
                  address benefactor,
                  address beneficiary
              ) external view returns (bool);

              function isWhitelistedBenefactor(
                  address benefactor
              ) external view returns (bool);
          }

          interface IERC20P31 {
              function balanceOf(
                  address account
              ) external view returns (uint256);
          }

          interface IERC4626P31 {
              function redeem(
                  uint256 shares,
                  address receiver,
                  address owner
              ) external returns (uint256);
          }

          contract P31_AdversarialMultiStage is Test {

              address constant MINTING =
                  0xe3490297a08d6fC8Da46Edb7B6142E4F461b62D3;

              address constant USDE =
                  0x4c9EDD5852cd905f086C759E8383e09bff1E68B3;

              address constant SUSDE =
                  0x9D39A5DE30e57443BfF2A8307A4256c8797A3497;

              address constant ATTACKER =
                  address(0xA11CE);

              address constant VICTIM =
                  address(0xB0B);

              function setUp() public {
                  vm.createSelectFork(
                      vm.envString("ETH_RPC_URL")
                  );
              }

              /*
               * STAGE 1
               *
               * Check whether an unprivileged attacker can
               * manipulate authorization state belonging to
               * another benefactor.
               */
              function testStage1_CrossAccountAuthorizationIsolation()
                  public
              {
                  IEthenaMintingP31 minting =
                      IEthenaMintingP31(MINTING);

                  bool beforeApproved =
                      minting.isApprovedBeneficiary(
                          VICTIM,
                          ATTACKER
                      );

                  bool beforeWhitelist =
                      minting.isWhitelistedBenefactor(
                          VICTIM
                      );

                  vm.startPrank(ATTACKER);

                  minting.setDelegatedSigner(
                      VICTIM
                  );

                  try minting.confirmDelegatedSigner(
                      VICTIM
                  ) {} catch {}

                  try minting.removeDelegatedSigner(
                      VICTIM
                  ) {} catch {}

                  try minting.setApprovedBeneficiary(
                      VICTIM,
                      true
                  ) {} catch {}

                  vm.stopPrank();

                  assertEq(
                      minting.isApprovedBeneficiary(
                          VICTIM,
                          ATTACKER
                      ),
                      beforeApproved
                  );

                  assertEq(
                      minting.isWhitelistedBenefactor(
                          VICTIM
                      ),
                      beforeWhitelist
                  );
              }

              /*
               * STAGE 2
               *
               * Attempt to reach mint/redeem directly from
               * an unprivileged account using an invalid signature.
               */
              function testStage2_UnprivilegedCannotReachMintRedeem()
                  public
              {
                  IEthenaMintingP31 minting =
                      IEthenaMintingP31(MINTING);

                  IEthenaMintingP31.Order memory order =
                      IEthenaMintingP31.Order({
                          order_id: "P31",
                          order_type:
                              IEthenaMintingP31.OrderType.MINT,
                          expiry:
                              uint120(
                                  block.timestamp + 1 days
                              ),
                          nonce: 1,
                          benefactor: ATTACKER,
                          beneficiary: ATTACKER,
                          collateral_asset: USDE,
                          collateral_amount: 1e18,
                          usde_amount: 1e18
                      });

                  IEthenaMintingP31.Route memory route;

                  route.addresses =
                      new address[](1);

                  route.ratios =
                      new uint128[](1);

                  route.addresses[0] =
                      ATTACKER;

                  route.ratios[0] =
                      10000;

                  IEthenaMintingP31.Signature memory sig;

                  sig.signature_type =
                      IEthenaMintingP31.SignatureType.EIP712;

                  sig.signature_bytes =
                      new bytes(65);

                  vm.prank(ATTACKER);

                  vm.expectRevert();

                  minting.mint(
                      order,
                      route,
                      sig
                  );

                  order.order_type =
                      IEthenaMintingP31.OrderType.REDEEM;

                  vm.prank(ATTACKER);

                  vm.expectRevert();

                  minting.redeem(
                      order,
                      sig
                  );
              }

              /*
               * STAGE 3
               *
               * Execute repeated authorization-state transitions
               * and verify that they cannot create USDe.
               */
              function testStage3_StateTransitionsDoNotCreateUSDe()
                  public
              {
                  deal(
                      USDE,
                      ATTACKER,
                      10e18
                  );

                  uint256 beforeBalance =
                      IERC20P31(USDE).balanceOf(
                          ATTACKER
                      );

                  IEthenaMintingP31 minting =
                      IEthenaMintingP31(MINTING);

                  for (
                      uint256 i = 0;
                      i < 32;
                      ++i
                  ) {
                      vm.startPrank(ATTACKER);

                      if (i % 4 == 0) {
                          try minting.setDelegatedSigner(
                              VICTIM
                          ) {} catch {}
                      }

                      if (i % 4 == 1) {
                          try minting.removeDelegatedSigner(
                              VICTIM
                          ) {} catch {}
                      }

                      if (i % 4 == 2) {
                          try minting.setApprovedBeneficiary(
                              VICTIM,
                              true
                          ) {} catch {}
                      }

                      if (i % 4 == 3) {
                          try minting.setApprovedBeneficiary(
                              VICTIM,
                              false
                          ) {} catch {}
                      }

                      vm.stopPrank();
                  }

                  uint256 afterBalance =
                      IERC20P31(USDE).balanceOf(
                          ATTACKER
                      );

                  assertEq(
                      afterBalance,
                      beforeBalance
                  );
              }

              /*
               * STAGE 4
               *
               * Attempt to manufacture value from sUSDe
               * without owning shares.
               */
              function testStage4_NoFreeValueFromSUSDe()
                  public
              {
                  uint256 beforeUSDe =
                      IERC20P31(USDE).balanceOf(
                          ATTACKER
                      );

                  uint256 beforeShares =
                      IERC20P31(SUSDE).balanceOf(
                          ATTACKER
                      );

                  vm.prank(ATTACKER);

                  try IERC4626P31(SUSDE).redeem(
                      1,
                      ATTACKER,
                      ATTACKER
                  ) {} catch {}

                  uint256 afterShares =
                      IERC20P31(SUSDE).balanceOf(
                          ATTACKER
                      );

                  uint256 afterUSDe =
                      IERC20P31(USDE).balanceOf(
                          ATTACKER
                      );

                  assertEq(
                      afterShares,
                      beforeShares
                  );

                  assertEq(
                      afterUSDe,
                      beforeUSDe
                  );
              }

              /*
               * STAGE 5
               *
               * Combined state-transition sequence.
               *
               * The important condition is not simply that
               * individual calls revert. The invariant is:
               *
               * attacker value after sequence
               * <= attacker value before sequence
               */
              function testStage5_CombinedSequencePreservesValue()
                  public
              {
                  deal(
                      USDE,
                      ATTACKER,
                      100e18
                  );

                  uint256 beforeValue =
                      IERC20P31(USDE).balanceOf(
                          ATTACKER
                      );

                  IEthenaMintingP31 minting =
                      IEthenaMintingP31(MINTING);

                  for (
                      uint256 i = 0;
                      i < 64;
                      ++i
                  ) {
                      vm.startPrank(ATTACKER);

                      if (i % 5 == 0) {
                          try minting.setDelegatedSigner(
                              VICTIM
                          ) {} catch {}
                      }

                      if (i % 5 == 1) {
                          try minting.removeDelegatedSigner(
                              VICTIM
                          ) {} catch {}
                      }

                      if (i % 5 == 2) {
                          try minting.setApprovedBeneficiary(
                              VICTIM,
                              true
                          ) {} catch {}
                      }

                      if (i % 5 == 3) {
                          try minting.setApprovedBeneficiary(
                              VICTIM,
                              false
                          ) {} catch {}

                      vm.stopPrank();
                  }

                  uint256 afterValue =
                      IERC20P31(USDE).balanceOf(
                          ATTACKER
                      );

                  assertLe(
                      afterValue,
                      beforeValue
                  );

                  emit log_named_uint(
                      "ATTACKER_USDE_BEFORE",
                      beforeValue
                  );

                  emit log_named_uint(
                      "ATTACKER_USDE_AFTER",
                      afterValue
                  );
              }
          }
          }
          SOL

      - name: Execute P31 on isolated mainnet fork
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: |
          set -euo pipefail

          test -n "$ETH_RPC_URL"

          cd /tmp/ethena-audit/package/source/bbp-public-assets/contracts

          forge build

          forge test \
            --match-path \
            test/foundry/minting/tests/P31_AdversarialMultiStage.t.sol \
            -vvv

          echo "P31_LOCAL_FORK_EXECUTION=PASS"

      - name: Emit submission gate
        run: |
          echo "EXECUTION_MODE=LOCAL_FORK_ONLY"
          echo "MAINNET_TRANSACTIONS=NONE"
          echo "LIVE_EXECUTION=PROHIBITED"
          echo "SUBMISSION=NOT_PERFORMED"
