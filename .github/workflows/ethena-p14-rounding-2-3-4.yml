name: Ethena P14 Rounding Probe 2-3-4 (Local Fork Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rounding-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com
      EXECUTION_MODE: LOCAL_FORK_READ_ONLY
      MAINNET_TRANSACTIONS: "NONE"
      LIVE_EXECUTION: PROHIBITED
      SUBMISSION: NOT_PERFORMED

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Start isolated Anvil fork
        shell: bash
        run: |
          set -euo pipefail

          anvil \
            --fork-url "$MAINNET_RPC_URL" \
            --chain-id 31337 \
            --host 127.0.0.1 \
            --port 8545 \
            > /tmp/anvil.log 2>&1 &

          for i in $(seq 1 30); do
            if cast chain-id \
              --rpc-url http://127.0.0.1:8545 \
              >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          test "$(
            cast chain-id \
              --rpc-url http://127.0.0.1:8545
          )" = "31337"

          echo "ANVIL_READY=PASS"

      - name: Run read-only rounding probes
        shell: bash
        run: |
          set -euo pipefail

          forge test \
            --fork-url http://127.0.0.1:8545 \
            --match-path test/EthenaP14Rounding234.t.sol \
            -vvvv

          test "$EXECUTION_MODE" = "LOCAL_FORK_READ_ONLY"
          test "$MAINNET_TRANSACTIONS" = "NONE"
          test "$LIVE_EXECUTION" = "PROHIBITED"
          test "$SUBMISSION" = "NOT_PERFORMED"

          echo "SAFETY_STATUS=PASS"

      - name: Dump Anvil log on failure
        if: failure()
        run: cat /tmp/anvil.log || true
