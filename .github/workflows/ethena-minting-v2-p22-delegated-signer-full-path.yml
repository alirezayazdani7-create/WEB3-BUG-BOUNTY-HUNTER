name: Ethena Minting V2 P22 Delegated Signer Full Path

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p22-delegated-signer-full-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EXECUTION_MODE: LOCAL_FORK_ONLY
      MAINNET_TRANSACTIONS: "NONE"
      LIVE_EXECUTION: PROHIBITED
      SUBMISSION: NOT_PERFORMED
      MAINNET_RPC_URL: "https://ethereum-rpc.publicnode.com"
      MINTING: "0xe3490297a08d6fC8Da46Edb7B6142E4F461b62D3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Start isolated Anvil fork
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "ETHENA MINTING V2 P22 DELEGATED SIGNER"
          echo "FULL MINT PATH"
          echo "=============================================="

          echo "EXECUTION_MODE=${EXECUTION_MODE}"
          echo "MAINNET_TRANSACTIONS=${MAINNET_TRANSACTIONS}"
          echo "LIVE_EXECUTION=${LIVE_EXECUTION}"
          echo "SUBMISSION=${SUBMISSION}"

          anvil \
            --fork-url "${MAINNET_RPC_URL}" \
            --chain-id 31337 \
            --host 127.0.0.1 \
            --port 8545 \
            --auto-impersonate \
            > /tmp/anvil.log 2>&1 &

          for i in $(seq 1 30); do
            if cast chain-id \
              --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1
            then
              break
            fi

            sleep 1
          done

          CHAIN_ID="$(
            cast chain-id \
              --rpc-url http://127.0.0.1:8545
          )"

          echo "LOCAL_CHAIN_ID=${CHAIN_ID}"

          test "${CHAIN_ID}" = "31337"

          echo "ANVIL_READY=PASS"

      - name: Configure local minter authorization
        shell: bash
        run: |
          set -euo pipefail

          RPC="http://127.0.0.1:8545"

          echo "=============================================="
          echo "LOCAL FORK AUTHORIZATION"
          echo "=============================================="

          OWNER="$(
            cast call \
              "${MINTING}" \
              "owner()(address)" \
              --rpc-url "${RPC}"
          )"

          echo "OWNER=${OWNER}"

          cast rpc \
            --rpc-url "${RPC}" \
            anvil_impersonateAccount \
            "${OWNER}"

          cast rpc \
            --rpc-url "${RPC}" \
            anvil_setBalance \
            "${OWNER}" \
            "0x3635C9ADC5DEA000000"

          MINTER_ROLE="$(
            cast keccak "MINTER_ROLE"
          )"

          echo "MINTER_ROLE=${MINTER_ROLE}"

          cast send \
            --unlocked \
            --from "${OWNER}" \
            "${MINTING}" \
            "grantRole(bytes32,address)" \
            "${MINTER_ROLE}" \
            "0x7E5F4552091A69125d5DfCb7b8C2659029395Bdf" \
            --rpc-url "${RPC}"

          HAS_ROLE="$(
            cast call \
              "${MINTING}" \
              "hasRole(bytes32,address)(bool)" \
              "${MINTER_ROLE}" \
              "0x7E5F4552091A69125d5DfCb7b8C2659029395Bdf" \
              --rpc-url "${RPC}"
          )"

          echo "MINTER_ROLE_GRANTED=${HAS_ROLE}"

          test "${HAS_ROLE}" = "true"

          echo "LOCAL_AUTHORIZATION=PASS"

      - name: Run P22 delegated signer full path tests
        shell: bash
        run: |
          set -euo pipefail

          forge test \
            --via-ir \
            --optimize \
            --fork-url http://127.0.0.1:8545 \
            --match-path test/MintingV2P22DelegatedSignerFullPath.t.sol \
            -vvvv

      - name: Final safety assertion
        shell: bash
        run: |
          set -euo pipefail

          test "${EXECUTION_MODE}" = "LOCAL_FORK_ONLY"
          test "${MAINNET_TRANSACTIONS}" = "NONE"
          test "${LIVE_EXECUTION}" = "PROHIBITED"
          test "${SUBMISSION}" = "NOT_PERFORMED"

          echo "SAFETY_STATUS=PASS"

      - name: Dump Anvil log on failure
        if: failure()
        shell: bash
        run: |
          cat /tmp/anvil.log || true
